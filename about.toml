# cargo-about configuration for `scripts/third-party-licenses.py`. The
# accepted list must match `[licenses] allow` plus the exceptions in
# `deny.toml`; the script refuses to run when they differ.
accepted = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
