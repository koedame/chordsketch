name: "@chordsketch/chordpro-lite"

# Typecheck, test, and build the @chordsketch/chordpro-lite package on
# every PR that touches it, plus pushes to main for post-merge
# verification. Publishing is not handled here: the package publishes
# with every release, from `publish-registries.yml` (ADR-0073).
#
# Like @chordsketch/react-ui, this package carries no wasm dependency
# (ADR-0060), so there is deliberately no Rust toolchain / wasm-pack /
# in-tree wasm build step — npm ci alone resolves everything it needs.
#
# The generated `src/bare-directives.ts` is NOT guarded here: it derives
# from the Rust directive catalog, and a catalog-only change matches
# none of the paths below. That guard is the unfiltered
# `directive-catalog-sync` job in `ci.yml`, which runs on every PR.

on:
  push:
    branches: [main]
    paths:
      - 'packages/chordpro-lite/**'
      - '.github/workflows/chordpro-lite.yml'
  pull_request:
    paths:
      - 'packages/chordpro-lite/**'
      - '.github/workflows/chordpro-lite.yml'

# Cancel stale PR runs on force-push / rebase. Main / workflow_dispatch
# runs always go to completion (gated on pull_request event).
concurrency:
  group: chordpro-lite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/chordpro-lite

jobs:
  build-and-test:
    name: Build and test @chordsketch/chordpro-lite
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/chordpro-lite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run vitest tests
        run: npm test

      - name: Build (tsup ESM + CJS + .d.ts)
        run: npm run build

      - name: Verify dist/ contents
        run: |
          set -euo pipefail
          test -f dist/index.js     # ESM
          test -f dist/index.cjs    # CJS
          test -f dist/index.d.ts   # Types for the ESM branch
          test -f dist/index.d.cts  # Types for the CJS branch
          echo "dist/ contents:"
          ls -la dist/

      - name: Smoke-test both built entry points
        # A published consumer reaches the package through `dist/`, not
        # through `src/`, so assert the built artefacts actually run —
        # the vitest suite above only exercises the sources.
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { detectFormat, extractLyrics, extractPreview } from './dist/index.js';
            if (detectFormat('{soc}\nx') !== 'chordpro') throw new Error('ESM: directive not detected');
            if (detectFormat('irealb://x') !== 'irealb') throw new Error('ESM: iReal URL not detected');
            if (extractLyrics('[G]Hello [Am]world') !== 'Hello world') throw new Error('ESM: lyrics');
            if (extractPreview('[C]word')[0].chords[0] !== 'C') throw new Error('ESM: preview');
          "
          node -e "
            const m = require('./dist/index.cjs');
            if (m.detectFormat('[Cmaj7/E]x') !== 'chordpro') throw new Error('CJS: inline chord not detected');
            if (typeof m.version !== 'string') throw new Error('CJS: version export');
          "
