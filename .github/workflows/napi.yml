name: napi-rs Native Addon

on:
  push:
    branches: [main]
    paths:
      - "crates/napi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/napi.yml"
      - ".github/actions/rust-cache/action.yml"
  pull_request:
    paths:
      - "crates/napi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/napi.yml"
      - ".github/actions/rust-cache/action.yml"
  # Reusable: called by release.yml's fan-out after the GitHub Release
  # exists, so `upload-release-tarballs` has somewhere to upload to
  # (ADR-0039). A non-empty `tag` is what puts this workflow in release
  # mode; on `push` / `pull_request` it is empty and only build + lint run.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to stage tarballs for (e.g., v0.2.0). Format-validated by the caller."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.2.0)"
        required: true
        type: string

# Cancel stale PR runs when a new commit is pushed to the same PR so
# that rebase / force-push does not leave two parallel napi-rs builds
# competing for the macOS 5-job concurrency cap. `main` pushes, tag
# pushes, and `workflow_dispatch` / `workflow_call` runs are not grouped
# with PRs and run to completion.
concurrency:
  group: napi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Force `bash -eo pipefail` for every `run:` block, including on the
# Windows matrix cell, so a broken command in a pipe or an empty
# `rustup target add` fails loud instead of being swallowed by pwsh's
# permissive defaults. Closes the fix-propagation gap from PR #1821
# (issue #1835). The unshelled blocks in this workflow — `rustup target
# add`, `npm install -g`, `napi build` — are all cross-platform CLI
# tools that behave identically under Git Bash on Windows, so switching
# away from pwsh has no functional impact.
# `-u` is added on top (issue #1836) so a typo'd env-var reference
# fails loud; every var-using block in this workflow already runs
# `set -euo pipefail` explicitly.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Intentionally fail-closed: if any build matrix cell fails, the
    # downstream `publish` job is skipped. The published
    # `@chordsketch/node` package resolves a platform-specific
    # prebuilt binary at install time via optionalDependencies; a
    # missing platform triple results in a hard install failure on
    # that platform with no universal fallback. Blocking the whole
    # release until every cell succeeds is the safer failure mode.
    # Contrast with `vscode-extension.yml build-platform`, which has
    # a universal VSIX fallback (#1795). See #1806.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/rust-cache
        with:
          # The Linux cells compile and link against the napi-cross
          # sysroot, so their C artifacts and build-script binaries are
          # not interchangeable with the host-toolchain ones a cache
          # keyed only by triple would hand back.
          shared-key: napi-${{ matrix.target }}${{ contains(matrix.target, '-linux-gnu') && '-napi-cross' || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli

      - name: Build native addon
        working-directory: crates/napi
        env:
          # Linux gnu addons must be linked against an old sysroot.
          # Building them on the runner's own toolchain — which is what
          # this step did for x86_64, and what the apt
          # `gcc-aarch64-linux-gnu` package did for aarch64 — bakes the
          # runner's glibc into the addon's support floor. Both published
          # v0.5.0 platform packages require GLIBC_2.39, so
          # `require('@chordsketch/node')` throws "version `GLIBC_2.39'
          # not found" on every distribution older than the runner
          # (Ubuntu 22.04, Debian 11, Rocky 8 all included). The addon
          # loads fine on the runner itself, so nothing in CI noticed.
          #
          # `--use-napi-cross` downloads @napi-rs/cross-toolchain, a
          # prebuilt gcc with a glibc 2.17 sysroot, and points cargo's
          # linker and CC at it. It is napi-rs's own answer to this
          # problem and covers exactly the Linux gnu targets this matrix
          # builds. Derived from the target triple rather than a matrix
          # flag so a Linux target added later cannot silently omit it —
          # forgetting the flag is how the x86_64 cell got here. See
          # ADR-0046.
          NAPI_CROSS: ${{ contains(matrix.target, '-linux-gnu') && '--use-napi-cross' || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--release --manifest-path Cargo.toml --target "$TARGET")
          if [ -n "$NAPI_CROSS" ]; then
            args+=("$NAPI_CROSS")
            # `--use-napi-cross` points the *linker* at the old
            # sysroot and exports `TARGET_CC`, but the `cc` crate only
            # honours `TARGET_CC` when the host and target triples
            # differ. On the x86_64 cell they are identical, so
            # `libz-sys`'s "is zlib installed?" probe compiles its smoke
            # test with the runner's own gcc, links `-lz` against the
            # runner's zlib, concludes zlib is present and emits
            # `cargo:rustc-link-lib=z`. rustc then links with the cross
            # gcc, whose sysroot has no libz, and the build dies with
            # `cannot find -lz`. (The aarch64 cell escapes it: there the
            # triples differ, the probe uses the cross gcc and fails, and
            # zlib is built from source.)
            #
            # `LIBZ_SYS_STATIC=1` is the crate's documented way to skip
            # the probe entirely and compile zlib from source, which is
            # what the `cross` container makes `ruby.yml` and
            # `kotlin.yml` do — their artifacts carry no libz dependency
            # either. Exported here rather than declared in `env:` so it
            # reaches no other target.
            export LIBZ_SYS_STATIC=1
          fi
          napi build "${args[@]}"

      - name: Verify glibc floor
        # Measures the artifact rather than the configuration: a
        # toolchain whose sysroot moves forward, or a target that stops
        # matching the `-linux-gnu` test above, both show up here. Runs
        # on every PR that touches this workflow's paths, and gates
        # `upload-release-tarballs` through `needs: [build]` at release
        # time.
        if: contains(matrix.target, '-linux-')
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/check-glibc-floor.py --target "$TARGET" crates/napi/*.node

      - name: Smoke test the built addon (host target only)
        # Load the just-built .node file into the runner's Node.js and call
        # every public API surface end-to-end. The unit tests in
        # `crates/napi/src/lib.rs` only exercise the underlying chordsketch
        # crates, not the napi wrapper functions, because napi::Error /
        # Buffer need the Node.js runtime for linking. CI is the only place
        # we can exercise the actual #[napi] -> JsValue boundary, so do it
        # here against the freshly-built artifact. See #1066.
        #
        # Cross-compiled targets (aarch64-linux from x86_64 runner) cannot
        # `require()` their `.node` file on the build host, so this step is
        # gated to host-native targets only. The published Node.js addon
        # still gets exercised end-to-end on every supported platform via
        # readme-smoke.
        if: |
          (matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu') ||
          (matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-darwin') ||
          (matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-msvc')
        working-directory: crates/napi
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => f.endsWith(".node"));
            if (files.length !== 1) {
              throw new Error("expected exactly 1 .node file, found " + files.length + ": " + files.join(","));
            }
            const m = require("./" + files[0]);
            const v = m.version();
            if (!v || typeof v !== "string") throw new Error("version() returned: " + JSON.stringify(v));
            console.log("version:", v);
            const text = m.renderText("{title:Test}\n[C]Hello");
            if (!text.includes("Test")) throw new Error("renderText output missing title");
            console.log("renderText: OK");
            const html = m.renderHtml("{title:Test}\n[C]Hello");
            if (!html.includes("Test")) throw new Error("renderHtml output missing title");
            console.log("renderHtml: OK");
            const pdf = m.renderPdf("{title:Test}\n[C]Hello");
            if (!Buffer.isBuffer(pdf)) throw new Error("renderPdf did not return a Buffer");
            if (!pdf.toString("utf8", 0, 4).startsWith("%PDF")) throw new Error("renderPdf output missing PDF header");
            console.log("renderPdf: OK");
            const optsText = m.renderTextWithOptions("{title:Test}\n[C]Hello", { transpose: 2 });
            if (!optsText.includes("Test")) throw new Error("renderTextWithOptions output missing title");
            console.log("renderTextWithOptions: OK");
            const optsHtml = m.renderHtmlWithOptions("{title:Test}\n[C]Hello", { config: "guitar" });
            if (!optsHtml.includes("Test")) throw new Error("renderHtmlWithOptions output missing title");
            console.log("renderHtmlWithOptions: OK");
            const optsPdf = m.renderPdfWithOptions("{title:Test}\n[C]Hello", { transpose: 2 });
            if (!Buffer.isBuffer(optsPdf)) throw new Error("renderPdfWithOptions did not return a Buffer");
            if (!optsPdf.toString("utf8", 0, 4).startsWith("%PDF")) throw new Error("renderPdfWithOptions output missing PDF header");
            console.log("renderPdfWithOptions: OK");
            const errs = m.validate("{title:T}\n[C]X");
            if (!Array.isArray(errs) || errs.length !== 0) throw new Error("validate(valid) returned " + JSON.stringify(errs));
            console.log("validate (valid): OK");
            const errs2 = m.validate("{title:T}\n[G");
            if (!Array.isArray(errs2) || errs2.length === 0) throw new Error("validate(broken) returned " + JSON.stringify(errs2));
            console.log("validate (broken): OK");
            console.log("All smoke tests passed!");
          '

      - name: Jest warning-routing test (host target only)
        # Exercises the full Rust flush_warnings → eprintln! → stderr path.
        # Must run after the .node artifact is built and on the same host
        # targets as the smoke test (cross-compiled artifacts cannot be
        # required on the build host).  See #1568.
        if: |
          (matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu') ||
          (matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-darwin') ||
          (matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-msvc')
        working-directory: crates/napi
        shell: bash
        run: |
          npm install --ignore-scripts
          npx jest --no-coverage

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-${{ matrix.target }}
          path: crates/napi/*.node
          retention-days: 7

  lint:
    name: Lint
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: napi-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy -p chordsketch-napi -- -D warnings

      - name: Format check
        run: cargo fmt --check -p chordsketch-napi

  upload-release-tarballs:
    name: Upload napi tarballs to GitHub Release
    # This job does not publish — it stages the platform packages with
    # their prebuilt .node files and uploads them as compressed tarballs
    # to the GitHub Release for `publish-registries.yml` to download and
    # publish through trusted publishing (ADR-0069).
    #
    # `build` must succeed so every target triple has an artifact to stage;
    # we download them all, assemble each platform package, and tar the
    # six packages (5 platforms + meta) into the release.
    needs: [build]
    # `inputs.tag` is the single release-mode discriminator: it is set on
    # the `workflow_call` (release.yml fan-out) and `workflow_dispatch`
    # paths and empty on `push` / `pull_request`. Testing the event name
    # would not work — under `workflow_call` the event is the *caller's*
    # (`push`, for a tag push), indistinguishable from a push to `main`.
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate release tag
        # Format-validate the tag before downstream steps derive a
        # `version` from it. See #1797. The `workflow_call` path arrives
        # pre-validated; this re-check guards `workflow_dispatch`, whose
        # input is user-supplied.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Staging @chordsketch/node@$version for publish-registries.yml"

      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: napi-artifacts
          pattern: napi-*
          merge-multiple: false

      - name: Stage and pack every package with its prebuilt binary
        # The staging lives in a script so `publishable.yml` runs exactly
        # these steps before every merge and checks the tarballs they
        # produce; a regression in the staging is caught there, not here
        # on release day. The script fails on a missing or empty `.node`
        # and on a committed version that is not the release version.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: crates/napi/scripts/stage-release-tarballs.sh napi-artifacts "$VERSION" release-staging

      - name: Check the tarballs are publishable
        # The same check `publishable.yml` runs before every merge, now
        # against the real release binaries.
        run: python3 scripts/check-publishable.py napi --tarballs release-staging

      - name: Upload tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        # `--clobber` lets a re-run overwrite the previous tarball if a
        # build was rebuilt against the same tag.
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-staging/*.tgz --clobber -R "$GITHUB_REPOSITORY"
