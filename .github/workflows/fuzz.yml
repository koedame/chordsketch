name: Fuzz

# Feeds random and mutated input to the ChordPro parser (`crates/chordpro`)
# with cargo-fuzz, looking for a panic, an out-of-memory abort, or an input
# that never finishes. The parser reads `.cho` files from strangers (the
# playground, the CLI, the editor extensions), so a crash on hostile input is
# a denial of service for whatever embeds it.
#
# Cadence: nightly, plus a 30 s smoke on pull requests that touch the fuzz
# harness itself. A pull request that only changes parser code does not run
# it: cargo-fuzz needs a nightly toolchain, which this repository's PR jobs do
# not otherwise compile with, and 30 s of fuzzing rarely finds what a
# 15-minute nightly run does. The nightly run reads whatever `main` holds the
# next morning, so a regression waits at most a day.
#
# The corpus is carried from one night to the next as the `fuzz-corpus-parse`
# artifact. A run downloads the artifact of the latest successful scheduled or
# manual run on `main`, adds the parser's fixtures as seeds, fuzzes, minimizes
# the result with `cargo fuzz cmin` and uploads it for the next run. Runs on
# pull requests may read the corpus but never write it, and never read an
# artifact produced by a pull request, so a fork cannot plant inputs. When
# there is nothing to download (first run, expired artifact) the run starts
# from the fixtures alone. An artifact is used instead of the Actions cache
# because the cache is size-capped and evicts the oldest entries silently.
#
# The fuzz crate lives in `crates/chordpro/fuzz/` as its own workspace root, so
# `libfuzzer-sys` never enters the SDK workspace or the zero-dependency
# contract of `chordsketch-chordpro` (`scripts/check-zero-deps.py`).

on:
  schedule:
    # Daily at 18:17 UTC (03:17 JST), off the hour to stay clear of the
    # other scheduled workflows.
    - cron: "17 18 * * *"
  pull_request:
    paths:
      - "crates/chordpro/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "900"

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Lists earlier runs and downloads their `fuzz-corpus-parse` artifact.
  actions: read

jobs:
  parse:
    name: Fuzz the ChordPro parser
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FUZZ_DIR: crates/chordpro/fuzz
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || inputs.seconds || '900' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # Sanitizer instrumentation is nightly-only.
          toolchain: nightly

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: fuzz-chordpro
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        # Pinned: `taiki-e/install-action` has no manifest for cargo-fuzz, and
        # an unpinned install would let a new release change what this job
        # runs without a commit here.
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore the corpus from the latest trusted run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FUZZ_DIR/corpus/parse"
          # Look the artifact up directly: the workflow-runs listing filtered
          # by status can miss a run that finished minutes ago. Only artifacts
          # of `schedule` and `workflow_dispatch` runs on `main` are trusted.
          # A pull request run never uploads one, but a fork branch can be
          # named `main`, so the event is checked on the run itself.
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fuzz-corpus-parse&per_page=20" \
            --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main")) | .[] | .workflow_run.id')
          restored=0
          for id in $candidates; do
            event=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.event')
            if [ "$event" != "schedule" ] && [ "$event" != "workflow_dispatch" ]; then
              echo "skipping run $id: it was a $event run"
              continue
            fi
            tmp=$(mktemp -d)
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name fuzz-corpus-parse --dir "$tmp"; then
              find "$tmp" -type f -exec cp -- {} "$FUZZ_DIR/corpus/parse/" \;
              restored=$(find "$FUZZ_DIR/corpus/parse" -type f | wc -l)
              echo "inherited $restored inputs from run $id"
              break
            fi
            echo "run $id has no usable fuzz-corpus-parse artifact"
          done
          if [ "$restored" -eq 0 ]; then
            echo "no corpus to inherit; starting from the fixtures alone"
          fi

      - name: Add the parser's fixtures as seeds
        run: |
          set -euo pipefail
          corpus="$FUZZ_DIR/corpus/parse"
          before=$(find "$corpus" -type f | wc -l)
          # A fixture the minimized corpus already kept under the same name
          # is not copied or counted again.
          find crates/chordpro/tests -name '*.cho' -type f | while read -r f; do
            dest="$corpus/$(printf '%s' "$f" | tr '/' '_')"
            [ -e "$dest" ] || cp -- "$f" "$dest"
          done
          after=$(find "$corpus" -type f | wc -l)
          echo "added $((after - before)) fixture inputs; starting with $after inputs ($before inherited)"

      - name: Fuzz parse
        # -timeout: an input that runs longer than 10 s counts as a hang.
        # -rss_limit_mb: an input that needs more than 2 GiB counts as an
        # out-of-memory crash. The parser's own input cap is 10 MiB, so
        # neither is reachable by legitimate input.
        run: |
          cargo +nightly fuzz run parse \
            --fuzz-dir "$FUZZ_DIR" --target-dir target/fuzz \
            -- \
            -dict="$FUZZ_DIR/chordpro.dict" \
            -max_total_time="$FUZZ_SECONDS" \
            -timeout=10 \
            -rss_limit_mb=2048

      - name: Minimize the corpus
        # Reached only when the fuzz step found nothing, so a corpus that
        # crashes the parser is never handed on.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          before=$(find "$FUZZ_DIR/corpus/parse" -type f | wc -l)
          cargo +nightly fuzz cmin parse \
            --fuzz-dir "$FUZZ_DIR" --target-dir target/fuzz
          after=$(find "$FUZZ_DIR/corpus/parse" -type f | wc -l)
          echo "minimized the corpus from $before to $after inputs"

      - name: Hand the corpus on to the next run
        # The 30 s smoke on a pull request reads the corpus but does not
        # replace it.
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-parse
          path: crates/chordpro/fuzz/corpus/parse/
          retention-days: 30
          if-no-files-found: error

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-parse-crash
          path: crates/chordpro/fuzz/artifacts/parse/
          if-no-files-found: ignore
