name: Temporary macOS signing probe

# Throwaway: checks the release-shaped macOS bundle and the certificate
# import on a real runner. Removed before the branch merges.

on:
  push:
    branches: [ci/desktop-signing-keychain-import]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quicklook:
    name: Quick Look after quarantine (${{ matrix.shape }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What desktop-release.yml builds with no Developer ID today.
          - shape: release-unsigned
            identity: ""
          # What desktop-build.yml builds.
          - shape: ad-hoc
            identity: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/desktop-build-steps
        with:
          target: aarch64-apple-darwin
          enable-cache: "true"
          cache-key-prefix: desktop-build
          apple-signing-identity: ${{ matrix.identity }}
      - name: Inspect signatures
        shell: bash
        run: |
          app=target/aarch64-apple-darwin/release/bundle/macos/ChordSketch.app
          codesign --display --verbose=2 "$app" 2>&1 || true
          codesign --display --verbose=2 "$app/Contents/PlugIns/ChordSketchQuickLook.appex" 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || echo "verify exit=$?"
      - name: Quarantine like a download, then clear it
        shell: bash
        run: |
          set -euo pipefail
          src=target/aarch64-apple-darwin/release/bundle/macos/ChordSketch.app
          dl="${RUNNER_TEMP}/download/ChordSketch.app"
          mkdir -p "$(dirname "$dl")"
          ditto "$src" "$dl"
          q="0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)"
          find "$dl" -exec xattr -w com.apple.quarantine "$q" {} \;
          xattr -p com.apple.quarantine "$dl"
          spctl --assess --type execute --verbose=2 "$dl" 2>&1 || echo "spctl exit=$? (quarantined)"
          xattr -dr com.apple.quarantine "$dl"
          if xattr -lr "$dl" | grep -q com.apple.quarantine; then echo "quarantine left"; exit 1; fi
      - name: Quick Look smoke (signature check reported, not enforced)
        shell: bash
        run: |
          sed 's/^codesign --verify --deep --strict --verbose=2 "\$app"$/codesign --verify --deep --strict --verbose=2 "$app" || echo "SIGNATURE CHECK FAILED (exit $?)"/' \
            apps/desktop/scripts/quicklook-smoke.sh >"${RUNNER_TEMP}/smoke.sh"
          grep -n "SIGNATURE CHECK" "${RUNNER_TEMP}/smoke.sh"
          cp apps/desktop/scripts/quicklook-render.swift "${RUNNER_TEMP}/"
          bash "${RUNNER_TEMP}/smoke.sh" "${RUNNER_TEMP}/download/ChordSketch.app" "${RUNNER_TEMP}/shots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.shape }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: warn
          retention-days: 3

  import:
    name: Certificate import with a throwaway identity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make a throwaway code-signing certificate
        id: cert
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cat >cert.cnf <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = ChordSketch CI Throwaway Signing
          [ext]
          basicConstraints = critical, CA:false
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -config cert.cnf -keyout key.pem -out cert.pem
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem \
            -out cert.p12 -passout pass:throwaway
          echo "b64=$(base64 -i cert.p12 | tr -d '\n')" >>"$GITHUB_OUTPUT"
          # A Developer ID chains to Apple's roots, which the runner
          # trusts; a self-signed one has to be trusted explicitly.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain cert.pem
      - uses: ./.github/actions/desktop-build-steps
        with:
          target: aarch64-apple-darwin
          enable-cache: "true"
          cache-key-prefix: desktop-build
          apple-signing-identity: ChordSketch CI Throwaway Signing
          apple-certificate: ${{ steps.cert.outputs.b64 }}
          apple-certificate-password: throwaway
      - name: Check who signed what
        shell: bash
        run: |
          set -euo pipefail
          app=target/aarch64-apple-darwin/release/bundle/macos/ChordSketch.app
          appex="$app/Contents/PlugIns/ChordSketchQuickLook.appex"
          for b in "$app" "$appex"; do
            codesign --display --verbose=4 "$b" 2>&1 | tee "${RUNNER_TEMP}/d.txt"
            grep -q '^Authority=ChordSketch CI Throwaway Signing$' "${RUNNER_TEMP}/d.txt"
          done
          codesign --display --entitlements - "$appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          security list-keychains -d user
          security find-identity -p codesigning
          apps/desktop/scripts/quicklook-smoke.sh "$app" "${RUNNER_TEMP}/shots" || echo "smoke exit=$? (informational for a self-signed identity)"
