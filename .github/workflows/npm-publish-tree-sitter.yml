name: Verify tree-sitter-chordpro build

# Publishing happens in publish-registries.yml (ADR-0069); this
# workflow only verifies that the tree-sitter-chordpro package's
# pre-generated parser files are present and that the package packs
# into a valid tarball.
#
# The generated parser files (src/parser.c, src/grammar.json) are
# already committed, so no build step is needed.

# Reusable: called by release.yml's fan-out (ADR-0039). `workflow_dispatch`
# stays as the re-run entry point.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to set in package.json before verifying (e.g., 0.1.0). No `v` prefix.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set in package.json before verifying (e.g., 0.1.0).'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tree-sitter-chordpro
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/tree-sitter-chordpro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Validate version input
        # See the sister step in npm-publish.yml: the version arrives from
        # `inputs.version` on both entry points, so it is validated once
        # instead of only on the `workflow_dispatch` path.
        uses: ./.github/actions/validate-release-version
        with:
          version: ${{ inputs.version }}

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Verify generated parser files are present
        # The grammar's src/parser.c and src/grammar.json are
        # committed (not generated at publish time). Make sure
        # they exist and reference the current version, so a
        # forgotten `tree-sitter generate` after a grammar change
        # is caught here rather than after the maintainer publishes.
        run: |
          test -f src/parser.c
          test -f src/grammar.json

      - name: Pack tarball (dry run)
        # Surfaces filename / size regressions without producing a
        # publish artefact. The publish job in publish-registries.yml
        # is the only operation that uploads to the registry.
        run: npm pack --dry-run
