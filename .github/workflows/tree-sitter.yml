name: Tree-sitter Grammar

# Validates the tree-sitter-chordpro grammar:
# - Generated parser (src/parser.c, src/grammar.json) matches grammar.js
# - External scanner (src/scanner.c) compiles correctly
# - All corpus tests pass
#
# This is a component-specific check (only the tree-sitter grammar can
# break these tests), so a paths: filter is appropriate — unlike
# guarantee-style checks that run unconditionally.

on:
  push:
    branches: [main]
    paths:
      - "packages/tree-sitter-chordpro/**"
      - ".github/workflows/tree-sitter.yml"
  pull_request:
    paths:
      - "packages/tree-sitter-chordpro/**"
      - ".github/workflows/tree-sitter.yml"

concurrency:
  group: tree-sitter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tree-sitter grammar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tree-sitter-chordpro
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/tree-sitter-chordpro/package-lock.json

      - name: Install tree-sitter-cli
        run: npm ci

      - name: Verify generated files are up-to-date
        run: |
          npm run generate
          if ! git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json; then
            echo "::error::Generated files are stale. Run 'tree-sitter generate' and commit the result."
            exit 1
          fi

      - name: Run corpus tests
        run: npm test

      - name: Validate queries against the grammar
        # `tree-sitter query` compiles each query against the freshly
        # generated parser, so an unknown node type or a malformed
        # S-expression exits non-zero (verified: a bogus node name
        # fails with `Invalid node type`). This is what keeps
        # `queries/*.scm` from silently rotting when `grammar.js`
        # renames a node — the corpus tests above cannot see queries
        # at all.
        #
        # Capture names (`@fold`, `@indent.zero`, …) are free-form
        # tree-sitter identifiers whose meaning is assigned by the
        # consuming editor, so they are deliberately not checked here.
        # That is why an editor whose vocabulary differs gets its own
        # `queries/<editor>/` set rather than a copy, and why the walk
        # below recurses: the node names are the part that has to stay
        # true for every set, whoever consumes it.
        #
        # The fixture is parsed, not just linted: it is written to
        # contain every node type the grammar can produce, so each
        # node name a query references is actually reachable.
        run: |
          found=0
          while read -r query; do
            echo "== $query"
            ./node_modules/.bin/tree-sitter query "$query" \
              test/fixtures/query-coverage.cho >/dev/null
            found=$((found + 1))
          done < <(find queries -name '*.scm' | sort)
          # An empty walk must fail. The glob this replaced did so by
          # accident — with no matches bash passes `queries/*.scm`
          # through literally and `tree-sitter query` fails on the
          # missing file — and losing that would turn "nothing was
          # validated" into a green step.
          if [ "$found" -eq 0 ]; then
            echo "::error::No query files found under queries/ — nothing was validated."
            exit 1
          fi
