name: Post-Release Package Updates

# Reusable: called by release.yml's fan-out after the GitHub Release
# exists (ADR-0039). Every job here targets the CLI/library release, and
# the caller's `push: tags: v*` trigger is what guarantees the tag is in
# that namespace — this workflow no longer sorts tags itself.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to fan out (e.g., v0.1.0). Format-validated by the caller."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        type: string

# Post-release runs key off an already-published GitHub Release (or a
# manual dispatch of a specific tag) and fan out to external package
# registries. Cancelling one mid-flight would leave some ecosystems
# updated and others not. Declare a concurrency group so the workflow
# conforms to `.claude/rules/ci-parallelization.md` §5, but keep
# `cancel-in-progress: false` so no partial rollouts are possible.
concurrency:
  group: post-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt

      - name: Generate formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract and validate SHA256 values from checksums.txt
          # `awk`, not `grep | awk`: under this workflow's `shell: bash`
          # default a non-matching `grep` fails the pipeline and ends the
          # step right here, so the guard below never gets to name what was
          # missing. `awk` exits 0 with no match. See #1852.
          SHA_AARCH64_APPLE=$(awk '/aarch64-apple-darwin/ { print $1 }' checksums.txt)
          SHA_X86_64_APPLE=$(awk '/x86_64-apple-darwin/ { print $1 }' checksums.txt)
          SHA_AARCH64_LINUX=$(awk '/aarch64-unknown-linux-gnu/ { print $1 }' checksums.txt)
          SHA_X86_64_LINUX=$(awk '/x86_64-unknown-linux-gnu/ { print $1 }' checksums.txt)

          for var_name in SHA_AARCH64_APPLE SHA_X86_64_APPLE SHA_AARCH64_LINUX SHA_X86_64_LINUX; do
            val="${!var_name}"
            if [[ ! "$val" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "ERROR: missing or invalid SHA256 for ${var_name}: '${val}'" >&2
              exit 1
            fi
          done

          # Generate formula from template
          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA256_AARCH64_APPLE_DARWIN}}/${SHA_AARCH64_APPLE}/g" \
            -e "s/{{SHA256_X86_64_APPLE_DARWIN}}/${SHA_X86_64_APPLE}/g" \
            -e "s/{{SHA256_AARCH64_UNKNOWN_LINUX_GNU}}/${SHA_AARCH64_LINUX}/g" \
            -e "s/{{SHA256_X86_64_UNKNOWN_LINUX_GNU}}/${SHA_X86_64_LINUX}/g" \
            packaging/homebrew/chordsketch.rb.template > chordsketch.rb

          cat chordsketch.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Note on credential persistence: both this URL-form approach
          # AND the previous `git config http.<url>.extraheader "..."`
          # approach persist the token to `tap/.git/config` — the URL
          # form embeds it in `[remote "origin"].url`, the extraheader
          # form embeds it in `[http "https://github.com/"].extraheader`.
          # Neither approach avoids on-disk credential persistence; the
          # working directory itself is the trust boundary. Do NOT
          # `actions/upload-artifact` the `tap/` directory — that is the
          # only way the token would leak from this step. See #1086 for
          # the prior comment that overstated the URL-form's security.
          # Use a credential helper or SSH deploy key if true zero-disk
          # credential persistence is required.
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/koedame/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          cp ../chordsketch.rb Formula/chordsketch.rb
          git add Formula/chordsketch.rb
          git commit -m "Update chordsketch to ${VERSION}"
          git push

  update-scoop:
    name: Update Scoop manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt

      - name: Generate manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `awk`, not `grep | awk`: under this workflow's `shell: bash`
          # default a non-matching `grep` fails the pipeline and ends the
          # step right here, so the guard below never gets to name what was
          # missing. `awk` exits 0 with no match. See #1852.
          SHA_WINDOWS=$(awk '/x86_64-pc-windows-msvc/ { print $1 }' checksums.txt)

          if [[ ! "$SHA_WINDOWS" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: missing or invalid SHA256 for x86_64-pc-windows-msvc: '${SHA_WINDOWS}'" >&2
            exit 1
          fi

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA256_X86_64_PC_WINDOWS_MSVC}}/${SHA_WINDOWS}/g" \
            packaging/scoop/chordsketch.json.template > chordsketch.json

          cat chordsketch.json

      - name: Push to scoop-bucket
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # See the credential-persistence note on `update-homebrew` above.
          # The token IS written to `bucket/.git/config`; do not artifact
          # this directory. #1086.
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/koedame/scoop-bucket.git" bucket
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p bucket
          cp ../chordsketch.json bucket/chordsketch.json
          git add bucket/chordsketch.json
          git commit -m "Update chordsketch to ${VERSION}"
          git push

  update-chocolatey:
    name: Update Chocolatey package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt

      - name: Generate package
        # Shared with chocolatey-retry.yml, like the pack-and-push step
        # below, so the two publication paths cannot drift in how the
        # package is assembled.
        uses: ./.github/actions/chocolatey-generate-package
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Pack and push
        # Shared with chocolatey-retry.yml so the release path and the
        # by-hand retry path cannot diverge. The dispositions below are
        # this job's half of that contract. Chocolatey is one job of
        # six in an automatic fan-out, so neither an unconfigured
        # channel nor a 403 from a moderation queue that has not drained
        # yet (#1852) is a reason to fail a release that has already
        # published to the other five. A 403 annotates the job with the
        # cause and the command that publishes this version once the
        # queue clears.
        uses: ./.github/actions/chocolatey-pack-push
        with:
          version: ${{ steps.version.outputs.version }}
          api-key: ${{ secrets.CHOCOLATEY_API_KEY }}
          on-missing-key: skip
          on-forbidden: warn

  update-snap:
    name: Update Snap package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ARCHIVE="chordsketch-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$TAG" -p "$ARCHIVE"
          mkdir -p stage
          tar xzf "$ARCHIVE" --strip-components=1 -C stage
          chmod +x stage/chordsketch
          ls -la stage/

      - name: Generate snapcraft.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p snap
          sed -e "s/{{VERSION}}/${VERSION}/g" \
            packaging/snap/snapcraft.yaml.template > snap/snapcraft.yaml
          cat snap/snapcraft.yaml

      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          snapcraft --destructive-mode

      - name: Upload and release
        env:
          SNAP_STORE_TOKEN: ${{ secrets.SNAP_STORE_TOKEN }}
        run: |
          if [ -z "$SNAP_STORE_TOKEN" ]; then
            echo "SNAP_STORE_TOKEN secret is not set; skipping Snap Store upload."
            echo "To enable automatic Snap updates, add the token"
            echo "as a repository secret named SNAP_STORE_TOKEN."
            exit 0
          fi

          export SNAPCRAFT_STORE_CREDENTIALS="$SNAP_STORE_TOKEN"
          SNAP_FILE=$(ls chordsketch_*.snap)
          snapcraft upload "$SNAP_FILE" --release=stable

  update-aur:
    name: Update AUR packages
    runs-on: ubuntu-latest
    # Two package bases, per the AUR submission guidelines: `chordsketch`
    # builds the tagged source, `chordsketch-bin` repackages the release's
    # prebuilt Linux archive. ADR-0071.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums and the source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$TAG" -p checksums.txt
          # The source package downloads GitHub's archive of the tag, which
          # is not a release asset and has no line in checksums.txt; its
          # checksum is taken from the same bytes makepkg will fetch.
          curl -fsSL --retry 3 -o "chordsketch-${VERSION}.tar.gz" \
            "https://github.com/koedame/chordsketch/archive/refs/tags/${TAG}.tar.gz"

      - name: Generate PKGBUILD and .SRCINFO
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `awk`, not `grep | awk`: under this workflow's `shell: bash`
          # default a non-matching `grep` fails the pipeline and ends the
          # step right here, so the guard below never gets to name what was
          # missing. `awk` exits 0 with no match. See #1852.
          SHA_LINUX=$(awk '/x86_64-unknown-linux-gnu/ { print $1 }' checksums.txt)

          if [[ ! "$SHA_LINUX" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: missing or invalid SHA256 for x86_64-unknown-linux-gnu: '${SHA_LINUX}'" >&2
            exit 1
          fi

          SHA_SOURCE=$(sha256sum "chordsketch-${VERSION}.tar.gz" | awk '{ print $1 }')

          for pkg in chordsketch chordsketch-bin; do
            mkdir -p "aur/${pkg}"
            sed \
              -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA256_X86_64_UNKNOWN_LINUX_GNU}}/${SHA_LINUX}/g" \
              -e "s/{{SHA256_SOURCE}}/${SHA_SOURCE}/g" \
              "packaging/aur/${pkg}/PKGBUILD.template" > "aur/${pkg}/PKGBUILD"
          done

          # The AUR reads .SRCINFO, and `makepkg --printsrcinfo` is the
          # writer the submission guidelines name. makepkg refuses to run
          # as root, hence the unprivileged user.
          docker run --rm -v "$PWD/aur:/aur" archlinux:base-devel bash -euo pipefail -c '
            useradd -m builder
            for pkg in chordsketch chordsketch-bin; do
              cp -r "/aur/${pkg}" /home/builder/
              chown -R builder "/home/builder/${pkg}"
              su builder -c "cd /home/builder/${pkg} && makepkg --printsrcinfo" > "/aur/${pkg}/.SRCINFO"
            done
          '

          for pkg in chordsketch chordsketch-bin; do
            echo "=== ${pkg}/PKGBUILD ==="
            cat "aur/${pkg}/PKGBUILD"
            echo "=== ${pkg}/.SRCINFO ==="
            cat "aur/${pkg}/.SRCINFO"
          done

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY secret is not set; skipping AUR push."
            echo "To enable automatic AUR updates, add the AUR SSH private key"
            echo "as a repository secret named AUR_SSH_KEY."
            exit 0
          fi

          # Set up SSH for AUR access
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSH_CONFIG

          # Cloning a package base that does not exist yet yields an empty
          # repository, and the first push creates the package; the AUR
          # only accepts `master`.
          for pkg in chordsketch chordsketch-bin; do
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "aur-repo-${pkg}"
            (
              cd "aur-repo-${pkg}"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              cp "../aur/${pkg}/PKGBUILD" "../aur/${pkg}/.SRCINFO" .
              git add PKGBUILD .SRCINFO
              # If nothing changed (re-run on same release), skip the push.
              if git diff --cached --quiet; then
                echo "AUR package ${pkg} already up-to-date for ${VERSION}; nothing to do."
                exit 0
              fi
              git commit -m "Update to ${VERSION}"
              git push origin HEAD:master
            )
          done
