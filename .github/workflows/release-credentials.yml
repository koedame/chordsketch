name: Release credentials

# Proves that every credential the release consumes is still accepted by the
# service that consumes it — without publishing anything. `scripts/release.py`
# dispatches this workflow as part of its preflight and refuses to push a tag
# while any job here is red (ADR-0068).
#
# Why this exists: on v0.6.0 the Docker Hub copy and the VS Code Marketplace
# publish both failed after the tag was already out, because their tokens
# had expired. The secrets were present, so a presence check
# (`scripts/check-env-secrets.py`) passed; only asking Docker Hub and Azure
# DevOps would have said no. The release was left half-published: every
# other channel had 0.6.0, those two stayed on 0.5.0.
#
# Each job resolves its secrets the same way the publish job does — same
# secret names, same `environment:` — so an environment-scoped secret that
# shadows a repository secret is the value tested here. Every check is
# read-only against the service:
#
#   docker-hub          registry token request must grant `push`
#   vscode-marketplace  `vsce verify-pat koedame`
#   open-vsx            `ovsx verify-pat koedame`
#   maven-central       Central Portal API accepts the credentials; the GPG
#                       key imports, is unexpired, and signs with its password
#   cocoapods           trunk session is valid and owns the `ChordSketch` pod
#   github-tokens       TAP_GITHUB_TOKEN may push to homebrew-tap and
#                       scoop-bucket; CLAUDE_PAT may push to this repository
#   aur                 the SSH key authenticates and owns `chordsketch`
#   snap                `snapcraft whoami` accepts the exported credentials
#   presence            secrets no service can verify without publishing
#                       (Chocolatey API key, Tauri updater key) are non-empty
#
# PyPI and RubyGems publish through OIDC trusted publishing, so there is no
# stored credential to check. crates.io and npm are published from the
# maintainer's machine (ADR-0008); `scripts/release.py` checks those locally.

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  docker-hub:
    name: Docker Hub token
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - name: Request a push-scoped registry token
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set"
            exit 1
          fi
          # Docker Hub answers bad or expired credentials with 401. Valid
          # credentials that lack write access still get a token, just
          # without `push` in its grant, so the grant is what we assert.
          url='https://auth.docker.io/token?service=registry.docker.io&scope=repository:koedame/chordsketch:pull,push'
          if ! body=$(curl -fsS -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" "$url"); then
            echo "::error::Docker Hub rejected DOCKERHUB_TOKEN (expired, revoked, or wrong username)"
            exit 1
          fi
          actions=$(printf '%s' "$body" | python3 -c '
          import base64, json, sys
          token = json.load(sys.stdin)["token"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          granted = [a for entry in claims.get("access", []) for a in entry.get("actions", [])]
          print(" ".join(granted))
          ')
          echo "granted: $actions"
          case " $actions " in
            *" push "*) ;;
            *)
              echo "::error::DOCKERHUB_TOKEN authenticates but cannot push to koedame/chordsketch (needs Read & Write)"
              exit 1
              ;;
          esac

  vscode-marketplace:
    name: VS Code Marketplace token
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/vscode-extension/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Install the vsce the publish job uses
        run: |
          version=$(jq -r '.packages["node_modules/@vscode/vsce"].version' packages/vscode-extension/package-lock.json)
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/vsce" "@vscode/vsce@$version"

      - name: Verify the token can publish as koedame
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set"
            exit 1
          fi
          "$RUNNER_TEMP/vsce/node_modules/.bin/vsce" verify-pat koedame

  open-vsx:
    name: Open VSX token
    runs-on: ubuntu-latest
    environment: open-vsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/vscode-extension/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Install the ovsx the publish job uses
        run: |
          version=$(jq -r '.packages["node_modules/ovsx"].version' packages/vscode-extension/package-lock.json)
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ovsx" "ovsx@$version"

      - name: Verify the token can publish to the koedame namespace
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OPEN_VSX_TOKEN is not set"
            exit 1
          fi
          "$RUNNER_TEMP/ovsx/node_modules/.bin/ovsx" verify-pat koedame

  maven-central:
    name: Maven Central credentials and signing key
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Verify the Central Portal credentials
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "::error::CENTRAL_PORTAL_USERNAME or CENTRAL_PORTAL_PASSWORD is not set"
            exit 1
          fi
          bearer=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$bearer"
          # A read-only Publisher API call: 401 for rejected credentials,
          # 200 with {"published": ...} otherwise.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $bearer" \
            'https://central.sonatype.com/api/v1/publisher/published?namespace=me.koeda&name=chordsketch&version=0.0.0')
          if [ "$status" != "200" ]; then
            echo "::error::Central Portal answered HTTP $status for CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD"
            exit 1
          fi

      - name: Verify the GPG key signs
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ] || [ -z "$GPG_SIGNING_PASSWORD" ]; then
            echo "::error::GPG_SIGNING_KEY or GPG_SIGNING_PASSWORD is not set"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_SIGNING_KEY" | gpg --batch --quiet --import
          # gpg refuses to sign with an expired or revoked key, and with a
          # wrong passphrase, so one detached signature covers all three.
          echo probe > "$RUNNER_TEMP/probe.txt"
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --detach-sign "$RUNNER_TEMP/probe.txt" 3<<<"$GPG_SIGNING_PASSWORD"; then
            echo "::error::GPG_SIGNING_KEY could not sign (expired key or wrong GPG_SIGNING_PASSWORD)"
            exit 1
          fi
          gpg --batch --verify "$RUNNER_TEMP/probe.txt.sig" "$RUNNER_TEMP/probe.txt"
          gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" || $1 == "ssb" { print $1, $7 }' \
            | while read -r kind expires; do
                echo "$kind expires: $([ -n "$expires" ] && date -u -d "@$expires" +%F || echo never)"
              done

  cocoapods:
    name: CocoaPods trunk session
    runs-on: ubuntu-latest
    steps:
      - name: Verify the session and pod ownership
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN is not set"
            exit 1
          fi
          if ! body=$(curl -fsS -H "Authorization: Token $COCOAPODS_TRUNK_TOKEN" https://trunk.cocoapods.org/api/v1/sessions); then
            echo "::error::CocoaPods trunk rejected COCOAPODS_TRUNK_TOKEN (sessions expire; re-register with 'pod trunk register')"
            exit 1
          fi
          # The session answer describes the owner (name, email, sessions)
          # but not their pods; the pod's public record lists its owners.
          # Matching the two emails proves the session may push the pod.
          pod=$(curl -fsS https://trunk.cocoapods.org/api/v1/pods/ChordSketch)
          SESSION="$body" POD="$pod" python3 -c '
          import json, os, sys
          owner = json.loads(os.environ["SESSION"])
          pod_owners = {o["email"] for o in json.loads(os.environ["POD"]).get("owners", [])}
          if owner.get("email") not in pod_owners:
              print("::error::the COCOAPODS_TRUNK_TOKEN session belongs to an account that does not own the ChordSketch pod")
              sys.exit(1)
          current = [s for s in owner.get("sessions", []) if s.get("current")]
          if current:
              print("session valid until:", current[0].get("valid_until"))
          '

  github-tokens:
    name: GitHub tokens
    runs-on: ubuntu-latest
    steps:
      - name: Verify push access
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
        run: |
          # `git push --dry-run` fetches the receive-pack advertisement,
          # which GitHub only serves to a token that may push, and sends
          # nothing. That is the permission the publish jobs use, so it is
          # the permission tested — repository read access would not do.
          git init -q "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          git -c user.name=probe -c user.email=probe@invalid commit -q --allow-empty -m probe

          failed=0
          check() {
            local name=$1 token=$2 repo=$3
            if [ -z "$token" ]; then
              echo "::error::$name is not set"
              failed=1
              return
            fi
            if GIT_TERMINAL_PROMPT=0 git push -q --dry-run \
                "https://x-access-token:${token}@github.com/${repo}.git" \
                HEAD:refs/heads/release-credentials-probe >/dev/null 2>&1; then
              echo "$name: can push to $repo"
            else
              echo "::error::$name cannot push to $repo (expired, revoked, or missing contents:write)"
              failed=1
              return
            fi
            expiry=$(curl -sS -o /dev/null -D - -H "Authorization: Bearer $token" https://api.github.com/rate_limit \
              | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" { print $2 }' | tr -d '\r')
            echo "$name expires: ${expiry:-never}"
          }
          check TAP_GITHUB_TOKEN "$TAP_GITHUB_TOKEN" koedame/homebrew-tap
          check TAP_GITHUB_TOKEN "$TAP_GITHUB_TOKEN" koedame/scoop-bucket
          check CLAUDE_PAT "$CLAUDE_PAT" koedame/chordsketch
          exit "$failed"

  aur:
    name: AUR SSH key
    runs-on: ubuntu-latest
    steps:
      - name: Verify the key owns the chordsketch package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/aur"
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          # `list-repos` prints the package bases the authenticated account
          # maintains, one per line behind a one-character marker (a space,
          # or `*` for a base that has never been pushed); an unregistered
          # key is refused before any output.
          if ! repos=$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" aur@aur.archlinux.org list-repos); then
            echo "::error::AUR refused AUR_SSH_KEY"
            exit 1
          fi
          if ! printf '%s\n' "$repos" | cut -c2- | grep -qx 'chordsketch'; then
            echo "::error::AUR_SSH_KEY authenticates but its account does not maintain chordsketch"
            exit 1
          fi

  snap:
    name: Snap Store credentials
    runs-on: ubuntu-latest
    steps:
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify the exported credentials
        env:
          SNAP_STORE_TOKEN: ${{ secrets.SNAP_STORE_TOKEN }}
        run: |
          if [ -z "$SNAP_STORE_TOKEN" ]; then
            echo "::error::SNAP_STORE_TOKEN is not set"
            exit 1
          fi
          export SNAPCRAFT_STORE_CREDENTIALS="$SNAP_STORE_TOKEN"
          if ! snapcraft whoami; then
            echo "::error::the Snap Store rejected SNAP_STORE_TOKEN (exported credentials expire; re-run 'snapcraft export-login')"
            exit 1
          fi

  presence:
    name: Credentials without a read-only check
    runs-on: ubuntu-latest
    steps:
      - name: Verify the secrets are set
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Chocolatey exposes no endpoint that checks an API key without a
          # push, and the Tauri updater key is a local signing key with no
          # expiry. Neither decays on its own, so presence is the check.
          failed=0
          for name in CHOCOLATEY_API_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              failed=1
            else
              echo "$name: set"
            fi
          done
          exit "$failed"
