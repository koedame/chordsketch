name: Dependency Audit

# Scans `Cargo.lock` against the RustSec advisory database (ADR-0048), and
# every `package-lock.json` and `requirements*.txt` against the npm and PyPI
# advisory databases (the "npm lockfiles" addendum to ADR-0048). Dependabot
# version updates are configured for `github-actions` and `cargo` only, and
# its alerts cover only what GitHub's dependency graph can see, so without
# the `npm` and `python` jobs nothing watched those lockfiles.
#
# The schedule is the load-bearing trigger: an advisory is published
# against a version this repo already depends on, so a dependency-change
# trigger alone can never see it. Before this workflow, the only place
# `cargo audit` ran was inside `/dependabot-review`, which fires only when
# a Dependabot PR is open for the affected crate — and Dependabot stops
# opening PRs for an ecosystem once five of its PRs are open (see the
# comment at the top of `.github/dependabot.yml`). The detector went quiet
# exactly when the backlog grew.
#
# The `pull_request` trigger is scoped to the inputs that decide this
# workflow's outcome (the same enumerable-inputs test ADR-0041 applies to
# `readme-smoke.yml`): the manifests and lockfile that produce the crate
# set, the ignore list that filters it, and the workflow and script that
# evaluate it. A PR that changes none of those cannot change the verdict.

on:
  schedule:
    # Daily at 06:00 UTC (15:00 JST). Advisories are published continuously
    # and independently of this repo's activity, so the sweep is daily
    # rather than weekly; the job installs a prebuilt binary and compiles
    # nothing, so the cost is a few runner-minutes per day.
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".cargo/audit.toml"
      - "deny.toml"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-advisories.py"
      - "scripts/test_audit_advisories.py"
      - "package-lock.json"
      - "**/package-lock.json"
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "scripts/audit-npm.py"
      - "scripts/test_audit_npm.py"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The `licenses` job holds every dependency to the allow list in `deny.toml`
# (ADR-0085): a crate under GPL, AGPL or LGPL alone, or under a license nobody
# decided to accept, fails the pull request that adds it. It does not run on
# the schedule: an advisory arrives against a version this repo already uses,
# but a license is fixed by the version, so a lock file that passed once
# cannot start failing.

# Fail-closed default per #1839; the job opts into `issues: write` for the
# scheduled reporting path.
permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisories
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # `cargo tree` (the scope classification below) needs a toolchain.
        # No Rust is compiled here, so there is no `Swatinem/rust-cache`
        # entry — per `.claude/rules/ci-parallelization.md` §2 cache belongs
        # to jobs that invoke `cargo build/test/clippy/doc`.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          # Deliberately unpinned: the advisory database is fetched at run
          # time anyway, and a security scanner that lags its own upstream
          # is the failure mode this workflow exists to avoid.
          tool: cargo-audit

      - name: Unit tests for the report script
        run: python3 -m unittest scripts/test_audit_advisories.py

      - name: Scan the lockfile
        run: |
          set -uo pipefail
          # cargo audit exits non-zero when it finds something and the
          # verdict is computed from the JSON below, so `-e` (which the
          # default shell sets) has to be off here — only a failure to
          # produce a report is fatal.
          set +e
          cargo audit --json > audit.json
          status=$?
          if ! python3 -c 'import json, sys; json.load(open("audit.json"))' 2>/dev/null; then
            echo "cargo audit produced no JSON report (exit ${status})" >&2
            cat audit.json >&2 || true
            exit 1
          fi

      - name: List crates reachable without dev-dependencies
        # Feeds the runtime / dev-only column. `--target all` keeps the
        # platform-gated crates (the GTK stack on Linux, windows-sys on
        # Windows) in the runtime set rather than labelling them dev-only
        # on a Linux runner.
        run: |
          cargo tree --workspace --edges normal,build --target all \
            --prefix none --format "{p}" > runtime-packages.txt

      - name: Scan the base branch's lockfile
        if: github.event_name == 'pull_request'
        # A pull request answers only for the advisories it introduces;
        # inherited ones belong to the scheduled sweep and its issue.
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          mkdir -p base
          git show "FETCH_HEAD:Cargo.lock" > base/Cargo.lock
          cargo audit --json --file base/Cargo.lock > base-audit.json || true
          python3 -c 'import json; json.load(open("base-audit.json"))'

      - name: Build the report
        id: report
        run: |
          set -uo pipefail
          # Same reason as the scan step: exit code 1 is a verdict, not a
          # step failure, so the default shell's `-e` has to be off.
          set +e
          args=(--audit-json audit.json
                --runtime-packages runtime-packages.txt
                --audit-config .cargo/audit.toml
                --output report.md)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--mode pr --base-audit-json base-audit.json)
          else
            args+=(--mode report)
          fi
          python3 scripts/audit-advisories.py "${args[@]}"
          code=$?
          # 0 = clean, 1 = something needs a human. Anything else is the
          # script itself failing and must not be read as a verdict.
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
          echo "needs_attention=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      - name: Fail on advisories introduced by this pull request
        if: github.event_name == 'pull_request' && steps.report.outputs.needs_attention != '0'
        run: |
          echo "This pull request introduces an advisory, or leaves a stale entry" >&2
          echo "in .cargo/audit.toml. See the job summary for the details." >&2
          exit 1

      - name: Open, update, or close the tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_ATTENTION: ${{ steps.report.outputs.needs_attention }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Security advisories in Cargo dependencies
        run: |
          set -euo pipefail

          # One rolling issue, matched by exact title: a fresh issue per run
          # would bury the tracker, and a fresh issue per advisory would
          # fragment a triage that is done against the whole set.
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | first | .number // empty')

          if [ "$NEEDS_ATTENTION" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment \
                "No advisories remain in \`Cargo.lock\` and the ignore list is clean ([run]($RUN_URL))."
              echo "Closed #$number"
            else
              echo "Clean, and no tracking issue is open."
            fi
            exit 0
          fi

          {
            cat report.md
            echo
            echo "---"
            echo
            echo "Maintained by \`.github/workflows/dependency-audit.yml\`: the body is"
            echo "rewritten on every change and the issue closes itself once the lockfile"
            echo "and the ignore list are both clean. Mute an advisory by adding it to"
            echo "\`.cargo/audit.toml\` with a \`# why:\` line and a \`# review-by:\` date."
          } > issue-body.md

          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file issue-body.md \
              --label dependencies --label priority:high
            exit 0
          fi

          # GitHub returns issue bodies with CRLF line endings, so compare
          # against a normalised copy — otherwise every run would look like
          # a change and comment about it.
          gh issue view "$number" --json body --jq .body | tr -d '\r' > current-body.md
          if cmp -s current-body.md issue-body.md; then
            echo "#$number is already up to date."
            exit 0
          fi

          gh issue edit "$number" --body-file issue-body.md
          # Editing a body sends no notification, so a change also gets a
          # comment naming what is new.
          grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' issue-body.md | sort -u > new-ids.txt || true
          grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' current-body.md | sort -u > old-ids.txt || true
          added=$(comm -13 old-ids.txt new-ids.txt | tr '\n' ' ' | sed 's/ *$//')
          if [ -n "$added" ]; then
            gh issue comment "$number" --body "New since the last update: $added ([run]($RUN_URL))."
          else
            gh issue comment "$number" --body "The advisory list changed ([run]($RUN_URL))."
          fi

  npm:
    name: npm advisories
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Unit tests for the report script
        run: python3 -m unittest scripts/test_audit_npm.py

      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "$GITHUB_BASE_REF"

      - name: Audit every package-lock.json
        id: report
        # The lockfiles are listed by `git ls-files` inside the script, so a
        # new `package-lock.json` is covered the day it lands. Exit code 1 is
        # a verdict, not a step failure, so the default shell's `-e` has to
        # be off; 2 means an audit could not be produced and must not be
        # read as a clean result.
        run: |
          set -uo pipefail
          set +e
          args=(--output report.md)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--mode pr --base-ref FETCH_HEAD)
          else
            args+=(--mode report)
          fi
          python3 scripts/audit-npm.py "${args[@]}"
          code=$?
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
          echo "needs_attention=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      - name: Fail on advisories introduced by this pull request
        if: github.event_name == 'pull_request' && steps.report.outputs.needs_attention != '0'
        run: |
          echo "This pull request introduces a high or critical npm advisory." >&2
          echo "See the job summary; \`npm audit fix\` in the lockfile's directory" >&2
          echo "usually moves it onto a patched version." >&2
          exit 1

      - name: Open, update, or close the tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_ATTENTION: ${{ steps.report.outputs.needs_attention }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Security advisories in npm dependencies
        run: |
          set -euo pipefail

          # One rolling issue, matched by exact title, as for the Cargo sweep.
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | first | .number // empty')

          if [ "$NEEDS_ATTENTION" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment \
                "No high or critical advisories remain in the npm lockfiles ([run]($RUN_URL))."
            else
              echo "Clean, and no tracking issue is open."
            fi
            exit 0
          fi

          {
            cat report.md
            echo
            echo "---"
            echo
            echo "Maintained by \`.github/workflows/dependency-audit.yml\`: the body is"
            echo "rewritten on every change and the issue closes itself once every"
            echo "lockfile is clean. Run \`npm audit fix\` in the lockfile's directory"
            echo "to move a package onto a patched version."
          } > issue-body.md

          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file issue-body.md \
              --label dependencies --label priority:high
            exit 0
          fi

          # GitHub returns issue bodies with CRLF line endings; compare
          # against a normalised copy so an unchanged body is not rewritten.
          gh issue view "$number" --json body --jq .body | tr -d '\r' > current-body.md
          if cmp -s current-body.md issue-body.md; then
            echo "#$number is already up to date."
            exit 0
          fi
          gh issue edit "$number" --body-file issue-body.md
          gh issue comment "$number" --body "The advisory list changed ([run]($RUN_URL))."

  python:
    name: Python requirements advisories
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pip-audit
        # Deliberately unpinned, for the reason `cargo-audit` is: the
        # advisory database is queried at run time and a scanner that lags
        # its own upstream is the failure mode this workflow exists to avoid.
        run: python3 -m pip install pip-audit

      - name: Audit every requirements file
        # These files pin a handful of build-tool packages, and a pin can
        # always move to a patched release, so unlike the sweeps above a
        # finding fails the run on every trigger instead of opening an issue.
        # `--no-deps --disable-pip` audits the pins as written: the files do
        # not carry hashes, so pip-audit cannot resolve them without
        # installing.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- 'requirements*.txt' '*/requirements*.txt')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no requirements file is tracked by git; refusing to report a clean result" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::$file"
            pip-audit --requirement "$file" --no-deps --disable-pip
            echo "::endgroup::"
          done

  licenses:
    name: Dependency licenses
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # `cargo deny` reads the dependency graph through `cargo metadata`.
        # Nothing is compiled, so no `Swatinem/rust-cache` entry.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny

      - name: Check the licenses of the dependency graph
        # `--all-features` and no `--target`: the CLI, the desktop app, the
        # wasm package and the native bindings ship for different platforms,
        # and a platform-specific crate has to be covered for the one it
        # ships on.
        run: cargo deny --all-features check licenses
