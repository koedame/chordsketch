name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode-extension/**"
      - "syntaxes/**"
      - ".github/workflows/vscode-extension.yml"
      # The `wasm-pack` pin the `build` job consumes through the
      # composite action (#2225). Without this entry a pin bump
      # would not re-run the from-source `@chordsketch/wasm` build.
      - ".github/actions/install-wasm-pack/action.yml"
      # The build and publish-setup composites, and the packaging checks
      # every job here runs.
      - ".github/actions/vscode-extension-build/action.yml"
      - ".github/actions/rust-cache/action.yml"
      - ".github/actions/vscode-extension-publish-setup/action.yml"
      - "scripts/_publish_checks.py"
      - "scripts/check-publishable.py"
  pull_request:
    paths:
      - "packages/vscode-extension/**"
      - "syntaxes/**"
      - ".github/workflows/vscode-extension.yml"
      # The `wasm-pack` pin the `build` job consumes through the
      # composite action (#2225). Without this entry a pin bump
      # would not re-run the from-source `@chordsketch/wasm` build.
      - ".github/actions/install-wasm-pack/action.yml"
      # The build and publish-setup composites, and the packaging checks
      # every job here runs.
      - ".github/actions/vscode-extension-build/action.yml"
      - ".github/actions/rust-cache/action.yml"
      - ".github/actions/vscode-extension-publish-setup/action.yml"
      - "scripts/_publish_checks.py"
      - "scripts/check-publishable.py"
  # Reusable: called by release.yml's fan-out after the GitHub Release
  # exists, so `build-platform` can download the per-platform
  # chordsketch-lsp archives from it (ADR-0039). A non-empty `tag` is what
  # puts this workflow in publish mode; on `push` / `pull_request` it is
  # empty and only the `build` CI job runs.
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Format-validated by the caller."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave blank to run CI on HEAD without publishing."
        required: false
        default: ""
        type: string

# Cancel stale PR runs when a new commit is pushed to the same PR so
# that rebase / force-push does not leave two parallel extension
# builds contending for Linux runner capacity (every job here is
# `ubuntu-latest`). `main` pushes, tag pushes, and `workflow_dispatch`
# / `workflow_call` runs are not grouped with PRs and run to completion.
concurrency:
  group: vscode-extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # See release-verify.yml for the rationale: add `-u` so a typo'd
    # environment-variable reference fails loud. Every `run:` block in
    # this workflow already sets `set -euo pipefail` explicitly, so the
    # default is strictly defense-in-depth (issue #1836).
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No `ref:` override — always check out main so package-lock.json
        # is present for Node.js caching. Same pattern as #1521.

      - uses: ./.github/actions/vscode-extension-build
        with:
          # Distinct shared-key per workflow so this wasm-pack build does
          # not thrash the cache shared by `wasm.yml`.
          cache-key: vscode-extension-wasm-pack

      - name: Type-check
        run: npm run lint
        working-directory: packages/vscode-extension

      - name: Unit tests
        run: npm test
        working-directory: packages/vscode-extension

      # Extension-host integration tests via @vscode/test-cli. Runs after
      # the composite's build so the compiled `dist/extension.js` is available for
      # the extension development host to load; that build is
      # the only production build — `npm run test:integration` deliberately
      # does NOT have a `pretest` hook that re-invokes `npm run build`, so
      # CI does not pay for two esbuild runs per PR.
      #
      # `.vscode-test.mjs` runs each test against two VS Code versions:
      #   - `stable` (latest release)
      #   - `engines.vscode` floor (read dynamically from package.json at
      #     config-load time, so a future engines bump is picked up here
      #     without editing this workflow).
      # Both cells execute in a single `npm run test:integration` invocation
      # — test-cli iterates the matrix internally. The first cold run
      # downloads both VS Code builds (~200 MB combined); subsequent runs
      # reuse the local cache.
      #
      # xvfb-run provides a virtual X display for Electron on the Linux
      # runner. Coverage completes the issue #1918 phased plan:
      # activation + command registration (#1914), LSP handshake
      # negotiation (#1913), preview panel, and the preview
      # WebviewPanelSerializer restart round-trip.
      - name: Compile integration tests
        run: npm run compile:integration
        working-directory: packages/vscode-extension

      - name: Integration tests (VS Code extension host)
        run: xvfb-run -a npm run test:integration
        working-directory: packages/vscode-extension

      - name: Package and check the universal VSIX
        run: python3 scripts/check-publishable.py vsce-package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chordsketch-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 7

  targets:
    name: VSIX targets
    # The platform-specific VSIXes to build, read from `VSCODE_TARGETS` in
    # scripts/_publish_checks.py — the same list the publish jobs check the
    # set against and publishable.yml packages on every pull request.
    # Alpine rows reuse the Linux `server_dir`: platform.ts reads
    # process.platform, which is "linux" on Alpine, so the musl binary must
    # land under server/linux-*; the alpine-* VSIX channel is what routes
    # it to musl users.
    if: inputs.tag != ''
    # Release job: stays hosted (ADR-0076, ADR-0078).
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: echo "matrix=$(python3 scripts/check-publishable.py vscode-matrix)" >> "$GITHUB_OUTPUT"

  build-platform:
    name: Package ${{ matrix.vs_target }} VSIX
    # Builds the VSIXes the release publishes, so it must not reuse the
    # pool's Rust cache, which pull requests can write (ADR-0078).
    runs-on: ubuntu-latest
    # Release-only matrix that downloads the per-platform chordsketch-lsp
    # binary from the GitHub Release assets (produced by release.yml), places
    # it at server/<platform>-<arch>/chordsketch-lsp[.exe], and packages a
    # platform-specific VSIX. Needed for Tier 3 of the LSP resolver in
    # packages/vscode-extension/src/platform.ts to succeed post-install. See #1786.
    #
    # This job used to be `continue-on-error: true` so that one failed
    # matrix cell would not skip the publish jobs (#1795) — the `Verify
    # expected VSIX count` step inside each publish job was left as the
    # only guardrail against shipping a partial set (now the VSIX set
    # check in each publish job). The cost was that a
    # wholly-failed matrix still reported the run green: on
    # `desktop-v0.5.0` nine of this workflow's ten jobs failed (all seven
    # cells here plus both publish jobs) and the run was still marked
    # successful. That is exactly the "red is invisible" failure this
    # rework exists to remove, so the masking is gone.
    #
    # Consequence, stated plainly: a failed cell now fails this job, which
    # skips both publish jobs and turns the release run red. That is the
    # same fail-closed shape `release.yml`'s `build` job already has, and
    # it is loud rather than silent — which is what #1795 actually wanted.
    # `fail-fast: false` stays so every cell still reports its own status.
    # The set check stays as defence in depth for the
    # `workflow_dispatch` path, where the matrix can be re-run piecemeal.
    #
    # `inputs.tag` is the publish-mode discriminator; see the sister comment
    # on napi.yml's `upload-release-tarballs` for why the event name cannot
    # be used under `workflow_call`.
    if: inputs.tag != ''
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same build publishable.yml packages on every pull request.
      - uses: ./.github/actions/vscode-extension-build
        with:
          cache-key: vscode-extension-wasm-pack

      - name: Validate release tag
        # Was an inline copy of the regex the composite action already
        # holds; a second copy of a security-relevant pattern is a
        # fix-propagation hazard, so this routes through the shared action
        # like every other release workflow. Defense in depth for the
        # `workflow_dispatch` path — the `workflow_call` path arrives
        # pre-validated. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      - name: Download and verify chordsketch-lsp from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RT: ${{ matrix.rust_target }}
          VS_TARGET: ${{ matrix.vs_target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          # release.yml emits .zip for Windows targets, .tar.gz for everything else.
          # Archive layouts differ (verified against v0.2.1):
          #   - tar.gz: wraps files in a top-level "chordsketch-<tag>-<target>/" dir
          #     (Unix `tar czf ARCHIVE STAGING`)
          #   - zip: files sit at the archive root, no top-level dir
          #     (PowerShell `Compress-Archive -Path "$Staging/*"`)
          # Extraction below uses `unzip -j` and `tar --strip-components=1` to
          # normalise both into lsp/. `-j` is defense-in-depth against a
          # future release.yml refactor that reintroduces a wrapping directory.
          # Use EXT (.exe on Windows targets) as the archive-format discriminator
          # so adding a future target like win32-arm64 "just works" — the
          # previous `VS_TARGET = win32-x64` check would silently download
          # .tar.gz for a new Windows cell and fail extraction.
          if [ "$EXT" = ".exe" ]; then
            ARCHIVE="chordsketch-${TAG}-${RT}.zip"
          else
            ARCHIVE="chordsketch-${TAG}-${RT}.tar.gz"
          fi
          # Download both the archive and checksums.txt, then verify SHA-256
          # before trusting the archive. The LSP binary auto-executes on user
          # machines when a .cho file is opened, so unsigned trust of a
          # mutable release asset would be a supply-chain hole. release.yml
          # emits checksums.txt alongside archives via `sha256sum`.
          gh release download "$TAG" -R koedame/chordsketch \
            --pattern "$ARCHIVE" \
            --pattern "checksums.txt"
          # Exact-filename match: extract the checksum line whose second
          # whitespace-separated field equals $ARCHIVE, rather than a regex
          # match where dots in ARCHIVE would match any char. Then pipe the
          # single canonical line to `sha256sum -c -` for verification.
          awk -v a="$ARCHIVE" '$2 == a { print; found = 1 } END { exit !found }' \
            checksums.txt | sha256sum -c -
          # The next step places the binary under server/ and packages it,
          # the way publishable.yml does on every pull request.
          mkdir -p lsp
          BIN="chordsketch-lsp${EXT}"
          if [[ "$ARCHIVE" == *.zip ]]; then
            unzip -j "$ARCHIVE" "$BIN" -d lsp/
          else
            tar xzf "$ARCHIVE" --strip-components=1 -C lsp/ \
              --wildcards "*/${BIN}"
          fi
          # Fail loud if extraction missed the binary.
          test -f "lsp/${BIN}"
          ls -la lsp/

      - name: Package and check the platform-specific VSIX
        env:
          VS_TARGET: ${{ matrix.vs_target }}
          EXT: ${{ matrix.ext }}
        run: python3 scripts/check-publishable.py vsce-package --target "$VS_TARGET" --lsp "lsp/chordsketch-lsp${EXT}"

      - name: Upload platform VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chordsketch-vsix-${{ matrix.vs_target }}
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to VS Code Marketplace
    needs: [build, build-platform]
    runs-on: ubuntu-latest
    # Publish only on GitHub Release (published) events or when workflow_dispatch supplies a tag.
    #
    # Prerequisites (one-time human setup before this job can succeed):
    #   1. Register publisher "koedame" at https://marketplace.visualstudio.com/manage
    #   2. Generate a Personal Access Token (PAT) with "Marketplace (Publish)" scope
    #      at https://dev.azure.com/koedame/_usersSettings/tokens
    #   3. Create the "vscode-marketplace" environment at
    #      https://github.com/koedame/chordsketch/settings/environments
    #      and add the PAT as the VSCE_PAT environment secret.
    #
    # If the "vscode-marketplace" environment does not exist (fork, fresh
    # instance), GitHub cannot start this job. That used to be masked so
    # the run stayed green (#1443); it is not any more. A release that
    # cannot publish the extension is a failed release, and the
    # pre-release checklist in docs/releasing.md already requires every
    # publish environment to exist before the tag is cut.
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=koedame.chordsketch
    if: inputs.tag != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No `ref:` override — always check out main so scripts/ is present.
        # Same pattern as #1521.

      - name: Check required secrets present
        # Fails fast when VSCE_PAT is missing so "environment missing → silent
        # skip" turns into a loud, diagnosable error. Paired with the
        # post-release rollup in release-verify.yml which catches the silent
        # case (where the environment gate itself is absent). See #1506.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: python3 scripts/check-env-secrets.py --channel vscode-marketplace

      - uses: ./.github/actions/vscode-extension-publish-setup

      - name: Download universal VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chordsketch-vsix
          path: packages/vscode-extension/

      - name: Download platform VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chordsketch-vsix-*
          merge-multiple: true
          path: packages/vscode-extension/

      - name: Check the VSIXes before publishing
        # Fail closed when any platform is missing rather than silently
        # shipping an incomplete set — build-platform is fail-fast: false,
        # and a missing platform VSIX leaves its users on the universal one
        # with no bundled LSP (#1786). The expected set is
        # `VSCODE_TARGETS` in scripts/_publish_checks.py, which also feeds
        # build-platform's matrix, so the two cannot disagree.
        run: python3 scripts/check-publishable.py vsix --dir packages/vscode-extension

      - name: Publish to Marketplace
        # vsce reads VSCE_PAT from the environment natively (>= 3.x), so no --pat flag needed.
        # Loop per-VSIX so one platform failing does not block the others; each
        # platform-specific VSIX carries its own --target metadata from packaging.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: packages/vscode-extension
        run: |
          set -euo pipefail
          status=0
          for vsix in *.vsix; do
            echo "::group::Publishing $vsix"
            ./node_modules/.bin/vsce publish --packagePath "$vsix" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  publish-openvsx:
    name: Publish to Open VSX Registry
    needs: [build, build-platform]
    runs-on: ubuntu-latest
    # Publish only on GitHub Release (published) events or when workflow_dispatch supplies a tag.
    #
    # Prerequisites (one-time human setup before this job can succeed):
    #   1. Create an account on https://open-vsx.org/ (GitHub login)
    #   2. Generate a personal access token at https://open-vsx.org/user-settings/tokens
    #   3. Create the "open-vsx" environment at
    #      https://github.com/koedame/chordsketch/settings/environments
    #      and add the token as the OPEN_VSX_TOKEN environment secret.
    #
    # If the "open-vsx" environment does not exist (fork, fresh instance),
    # GitHub cannot start this job. See the sister comment on `publish`
    # above for why the failure is no longer masked (#1604).
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/koedame/chordsketch
    if: inputs.tag != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No `ref:` override — always check out main so scripts/ is present.

      - name: Check required secrets present
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: python3 scripts/check-env-secrets.py --channel open-vsx

      - uses: ./.github/actions/vscode-extension-publish-setup

      - name: Download universal VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chordsketch-vsix
          path: packages/vscode-extension/

      - name: Download platform VSIX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chordsketch-vsix-*
          merge-multiple: true
          path: packages/vscode-extension/

      - name: Check the VSIXes before publishing
        # One universal plus one per target, each publishable: the same
        # check publishable.yml runs on every pull request.
        run: python3 scripts/check-publishable.py vsix --dir packages/vscode-extension

      - name: Publish to Open VSX
        # ovsx reads OVSX_PAT from the environment natively (no --pat flag
        # needed), matching the pattern used for vsce + VSCE_PAT above.
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        working-directory: packages/vscode-extension
        run: |
          set -euo pipefail
          status=0
          for vsix in *.vsix; do
            echo "::group::Publishing $vsix"
            ./node_modules/.bin/ovsx publish "$vsix" || status=1
            echo "::endgroup::"
          done
          exit "$status"
