name: "@chordsketch/svelte"

# Typecheck, test, and build the @chordsketch/svelte package on every
# PR that touches it, plus pushes to main for post-merge verification.
# Publish-on-tag is intentionally NOT handled here — per ADR-0008,
# every npm publish for every ChordSketch-distributed package is a
# maintainer-local manual operation. The maintainer runs
# `cd packages/svelte && npm run build && npm publish --access public`
# on the release machine.
#
# Like @chordsketch/vue, this package does not type-check against the
# in-tree wasm build: every wasm call site casts the dynamic import to
# its own narrow structural interface, and the ambient
# `declare module` shims cover resolution. There is therefore
# deliberately no Rust toolchain / wasm-pack / in-tree wasm build
# step — npm ci alone resolves everything it needs.

on:
  push:
    branches: [main]
    paths:
      - 'packages/svelte/**'
      - '.github/workflows/svelte.yml'
  pull_request:
    paths:
      - 'packages/svelte/**'
      - '.github/workflows/svelte.yml'

# Cancel stale PR runs on force-push / rebase. Main / workflow_dispatch
# runs always go to completion (gated on pull_request event).
concurrency:
  group: svelte-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/svelte

jobs:
  build-and-test:
    name: Build and test @chordsketch/svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/svelte/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run typecheck

      - name: Run vitest tests
        run: npm test

      - name: Build (svelte-package)
        run: npm run build

      - name: Verify dist/ contents
        run: |
          set -euo pipefail
          test -f dist/index.js              # Package entry
          test -f dist/index.d.ts            # Types for the entry
          test -f dist/ChordSheet.svelte     # Components ship as sources
          test -f dist/ChordSheet.svelte.d.ts # …with generated types
          test -f dist/styles.css            # Component stylesheet
          # The components ship as sources, preprocessed to plain JS
          # (svelte.config.js explains why). `interface Props` is the
          # signature of that step not running: svelte-package keeps the
          # `lang="ts"` attribute on purpose for Svelte 5, so the attribute
          # cannot be the check.
          ! grep -rln 'interface Props' dist/*.svelte
          echo "dist/ contents:"
          ls -la dist/
