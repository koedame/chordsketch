name: "@chordsketch/svelte"

# Typecheck, test, and build the @chordsketch/svelte package on every
# PR that touches it, plus pushes to main for post-merge verification.
# Publishing is not handled here: the package publishes with every
# release, from `publish-registries.yml` (ADR-0073).
#
# The package's lockfile installs @chordsketch/wasm from the in-tree
# `packages/npm` rather than from npm (ADR-0073), so the tests run
# against the wasm this commit would release. That directory holds only
# the manifest until it is built, so the wasm bundle is built before the
# tests, as `react.yml` does.

on:
  push:
    branches: [main]
    paths:
      - 'packages/svelte/**'
      - '.github/workflows/svelte.yml'
      # The `wasm-pack` pin the in-tree wasm build below consumes
      # through the composite action (#2225).
      - '.github/actions/install-wasm-pack/action.yml'
  pull_request:
    paths:
      - 'packages/svelte/**'
      - '.github/workflows/svelte.yml'
      # The `wasm-pack` pin the in-tree wasm build below consumes
      # through the composite action (#2225).
      - '.github/actions/install-wasm-pack/action.yml'

# Cancel stale PR runs on force-push / rebase. Main / workflow_dispatch
# runs always go to completion (gated on pull_request event).
concurrency:
  group: svelte-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/svelte

jobs:
  build-and-test:
    name: Build and test @chordsketch/svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: svelte-wasm32-unknown-unknown
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/svelte/package-lock.json

      - name: Build in-tree wasm bundle
        run: npm run build
        working-directory: packages/npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run typecheck

      - name: Run vitest tests
        run: npm test

      - name: Build (svelte-package)
        run: npm run build

      - name: Verify dist/ contents
        run: |
          set -euo pipefail
          test -f dist/index.js              # Package entry
          test -f dist/index.d.ts            # Types for the entry
          test -f dist/ChordSheet.svelte     # Components ship as sources
          test -f dist/ChordSheet.svelte.d.ts # …with generated types
          test -f dist/styles.css            # Component stylesheet
          # The components ship as sources, preprocessed to plain JS
          # (svelte.config.js explains why). `interface Props` is the
          # signature of that step not running: svelte-package keeps the
          # `lang="ts"` attribute on purpose for Svelte 5, so the attribute
          # cannot be the check.
          ! grep -rln 'interface Props' dist/*.svelte
          echo "dist/ contents:"
          ls -la dist/
