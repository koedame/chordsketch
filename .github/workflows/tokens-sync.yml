name: Design System Sync Check

# design-system/ is the single source of truth for two generated regions, and
# this job holds both at a zero diff.
#
#   - Tokens (ADR-0038): scripts/build-tokens.mjs projects
#     design-system/tokens.css into the per-package token blocks (the `--cs-*`
#     blocks in @chordsketch/react{,-ui} and the bare `:root` block in
#     @chordsketch/ui-irealb-editor).
#   - Chrome & layout (ADR-0060): scripts/build-chrome-css.mjs projects the
#     canonical `.topnav` / `.sidenav` / `.pane*` / `.stack*` rules out of the
#     design-system reference pages into @chordsketch/react-ui's stylesheet.
#
# When this check fails, run the generator named in the failing step and commit
# the regenerated stylesheets, or revert the hand-edit to a generated block.

on:
  pull_request:
    paths:
      - "design-system/tokens.css"
      - "design-system/ui_kits/web/editor.html"
      - "design-system/preview/components-navigation.html"
      - "design-system/preview/layout-stack.html"
      - "packages/react/src/styles.css"
      - "packages/react-ui/src/styles.css"
      - "packages/ui-irealb-editor/src/style.css"
      - "packages/playground/src/playground.css"
      - "scripts/build-tokens.mjs"
      - "scripts/build-chrome-css.mjs"
      - ".github/workflows/tokens-sync.yml"
  push:
    branches: [main]
    paths:
      - "design-system/tokens.css"
      - "design-system/ui_kits/web/editor.html"
      - "design-system/preview/components-navigation.html"
      - "design-system/preview/layout-stack.html"
      - "packages/react/src/styles.css"
      - "packages/react-ui/src/styles.css"
      - "packages/ui-irealb-editor/src/style.css"
      - "packages/playground/src/playground.css"
      - "scripts/build-tokens.mjs"
      - "scripts/build-chrome-css.mjs"
      - ".github/workflows/tokens-sync.yml"

permissions:
  contents: read

jobs:
  check-design-system-sync:
    name: Verify generated design-system blocks are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Regenerate token blocks from tokens.css
        run: node scripts/build-tokens.mjs

      - name: Regenerate the chrome & layout block from the design-system reference
        run: node scripts/build-chrome-css.mjs

      - name: Assert the regenerated blocks are committed (no drift)
        run: |
          git diff --exit-code -- \
            packages/react/src/styles.css \
            packages/react-ui/src/styles.css \
            packages/ui-irealb-editor/src/style.css \
            packages/playground/src/playground.css
