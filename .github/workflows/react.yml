name: "@chordsketch/react"

# Lint, typecheck, build, and smoke-test the @chordsketch/react
# package on every PR that touches it, plus pushes to main for
# post-merge verification. Publishing is not handled here: the
# package publishes with every release, from `publish-registries.yml`
# (ADR-0073).

on:
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - '.github/workflows/react.yml'
      - '.github/actions/rust-cache/action.yml'
      # The `wasm-pack` pin this workflow consumes through the
      # composite action (#2225). Without this entry a pin bump
      # would not re-run the wasm build that depends on it.
      - '.github/actions/install-wasm-pack/action.yml'
  pull_request:
    paths:
      - 'packages/react/**'
      - '.github/workflows/react.yml'
      - '.github/actions/rust-cache/action.yml'
      # The `wasm-pack` pin this workflow consumes through the
      # composite action (#2225). Without this entry a pin bump
      # would not re-run the wasm build that depends on it.
      - '.github/actions/install-wasm-pack/action.yml'

# Cancel stale PR runs on force-push / rebase. Main / workflow_dispatch
# runs always go to completion (gated on pull_request event).
concurrency:
  group: react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/react

jobs:
  build-and-test:
    name: Build and test @chordsketch/react
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The React package's tsconfig paths map for the wasm bundle
      # points at the in-tree build under `packages/npm/web/` so
      # tsc can see the new parseChordpro / parseChordproWithOptions
      # exports the AST -> JSX walker depends on (#2475 /
      # ADR-0017). The published @chordsketch/wasm@0.3.x on npm
      # does not yet ship those exports, so the in-tree build
      # must produce `packages/npm/web/chordsketch_wasm.d.ts`
      # before tsc runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: react-wasm32-unknown-unknown
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/react/package-lock.json

      - name: Build in-tree wasm bundle
        run: npm run build
        working-directory: packages/npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run vitest smoke tests
        run: npm test

      - name: Build (tsup ESM + CJS + .d.ts)
        run: npm run build

      - name: Verify dist/ contents
        run: |
          set -euo pipefail
          test -f dist/index.js     # ESM
          test -f dist/index.cjs    # CJS
          test -f dist/index.d.ts   # Types for the ESM branch
          test -f dist/index.d.cts  # Types for the CJS branch (exports."."["require"].types)
          test -f dist/styles.css   # Reserved CSS import path
          echo "dist/ contents:"
          ls -la dist/
