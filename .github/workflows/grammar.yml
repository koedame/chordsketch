name: Grammar Tests

on:
  push:
    branches: [main]
    paths:
      - "syntaxes/**"
      - ".github/workflows/grammar.yml"
  pull_request:
    paths:
      - "syntaxes/**"
      - ".github/workflows/grammar.yml"

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: TextMate grammar snapshot tests
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: syntaxes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: syntaxes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run grammar tests
        run: npm test
