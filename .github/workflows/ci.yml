name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # GitHub Merge Queue was disabled on `main` per
  # docs/adr/0015-disable-github-merge-queue.md, so no `merge_group`
  # event is produced today and this trigger is a no-op. It is kept
  # in place so that re-enabling the queue (should a future ADR
  # supersede 0015) does not require a workflow edit, and so the
  # secret-access caveat documented in ADR-0015 remains a single-edit
  # change rather than a workflow-and-rule change. Removing this line
  # is safe; do not add new `merge_group:` triggers without first
  # superseding ADR-0015.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fail-closed default: jobs that need write scopes must opt in via
# job-level `permissions:`. See issue #1839.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy lints
        # `chordsketch-desktop` is excluded because its Tauri/WRY deps
        # need webkit2gtk/appindicator system libs that are installed
        # only in the dedicated `desktop-smoke` job. Cross-platform
        # coverage is tracked in #2077.
        run: cargo clippy --workspace --exclude chordsketch-desktop --all-targets -- -D warnings

      - name: Clippy lints (chordsketch-render-ireal --features png,pdf)
        # The `png` (#2064) and `pdf` (#2063) features are both off
        # by default; the workspace clippy run above does not
        # exercise them, so a clippy regression inside either
        # feature-gated module would not surface. Lint with both
        # features in one pass — they share the same `usvg` 0.43
        # transitive line, so this does not double-compile the SVG
        # parser.
        run: cargo clippy -p chordsketch-render-ireal --features png,pdf --all-targets -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build docs (warnings as errors)
        # See the clippy job for the `chordsketch-desktop` exclusion rationale.
        #
        # `--features chordsketch-render-ireal/png,chordsketch-render-ireal/pdf`
        # doc-checks the feature-gated `png` (#2064) and `pdf`
        # (#2063) modules too. Without these, broken intra-doc
        # links inside either module would not surface, and a link
        # from the always-on crate root into a gated module would
        # fail rustdoc's broken-link check anyway because the gated
        # module would not be in the rendered tree.
        run: |
          cargo doc --workspace --exclude chordsketch-desktop \
            --features chordsketch-render-ireal/png,chordsketch-render-ireal/pdf \
            --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  version-consistency:
    name: Version consistency
    # Enforces that every versioned manifest (workspace crates, the npm,
    # vscode-extension, and napi package.json files, and the hardcoded pins
    # inside readme-smoke.yml) is either aligned with the canonical workspace
    # crate version or has an explicit entry in
    # ci/version-skew-allowlist.toml. Every allowlist entry must reference a
    # tracking issue so skews cannot silently rot. See #1506.
    #
    # Intentionally Python-only, no cargo invocation — runs in ~2-3 seconds,
    # gives near-instant feedback on PRs that forget to bump a manifest.
    # No rust-cache entry is needed (per .claude/rules/ci-parallelization.md
    # §2: the job does not compile Rust).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run consistency check
        run: python3 scripts/check-version-consistency.py

      - name: Unit tests
        run: |
          python3 -m unittest scripts/test_check_version_consistency.py scripts/test_check_release_channels.py

  msrv-consistency:
    name: MSRV consistency
    # Keeps every restatement of `rust-version` in step with the
    # workspace declaration: the `FROM rust:<tag>@sha256:<digest>`
    # builder pin in every Dockerfile, and README's "Requires Rust N.M
    # or later." sentence under the from-source install section.
    #
    # Neither site is built or asserted by anything else on a PR.
    # `docker.yml` publishes from `Dockerfile.release`, which copies a
    # prebuilt musl binary and never compiles Rust, so the from-source
    # `Dockerfile` is baked by no workflow at all; `readme-sync.yml`
    # snapshots the bash commands in that README section, not the prose
    # around them. A pin left behind by an MSRV bump therefore stays
    # green until a user runs `docker build .` — which is how the
    # builder sat on `rust:1.85-bookworm` after the workspace moved to
    # 1.88, where `cargo build` refuses to compile at all.
    #
    # Guarantee-style check like the guard jobs around it: no paths:
    # filter, runs on every PR. Python-only, no network and no docker
    # pull, sub-second wall clock; no rust-cache needed (per
    # `.claude/rules/ci-parallelization.md` §2 the job does not compile
    # Rust). See ADR-0062 for why this is a text check rather than a
    # `docker build` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check the MSRV restatements
        run: python3 scripts/check-msrv-consistency.py

      - name: Unit tests
        run: python3 -m unittest scripts/test_check_msrv_consistency.py

  fixture-counts:
    name: Fixture counts
    # Enforces the minimum per-renderer golden fixture counts documented in
    # `.claude/rules/golden-tests.md`. Guarantee-style check per
    # `.claude/rules/ci-parallelization.md` §3 — no paths: filter, runs on
    # every PR. Python-only, ~1 second wall clock; no rust-cache needed
    # (does not compile Rust).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Count fixtures
        run: python3 scripts/check-fixture-counts.py

      - name: Unit tests
        run: python3 -m unittest scripts/test_check_fixture_counts.py

  design-system-tertiary:
    name: Design system tertiary ink
    # Keeps the tertiary tone off small copy in the design-system static
    # reference pages, the way `packages/react{,-ui}/tests/tertiary-ink.test.ts`
    # keeps it off the shipped stylesheets: `--ink-500` is 3.53:1, which
    # clears the 3:1 WCAG 1.4.11 asks of non-text UI but not the 4.5:1
    # SC 1.4.3 asks of text below 18.66px bold / 24px regular (ADR-0054).
    # Those pages have no test runner of their own, so the guard is a
    # standalone script. No paths: filter — the constraint is a
    # project-wide guarantee, so it runs on every PR the way the other
    # guard jobs in this workflow do. Python-only, sub-second wall clock;
    # no rust-cache needed (the job does not compile Rust).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check tertiary-ink sites
        run: python3 scripts/check-design-system-tertiary.py

      - name: Unit tests
        run: python3 -m unittest scripts/test_check_design_system_tertiary.py

  core-zero-deps:
    name: Core crate zero-deps
    # Enforces the zero-external-dependency contract for the core crates
    # (`chordsketch-chordpro`, `chordsketch-ireal`) documented in CLAUDE.md
    # "Dependency Policy" and `.claude/rules/code-style.md`. A stray
    # dev/build/normal dep drags a network-fetched transitive graph
    # (e.g. tempfile -> getrandom) back into every `cargo metadata`
    # resolution, which is what made the cold-cache desktop-build wasm
    # step fragile. Guarantee-style check per
    # `.claude/rules/ci-parallelization.md` §3 — no paths: filter, runs on
    # every PR. Python-only, sub-second wall clock; no rust-cache needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check core crate dependencies
        run: python3 scripts/check-zero-deps.py

      - name: Unit tests
        run: python3 -m unittest scripts/test_check_zero_deps.py

  glibc-floor:
    name: Linux glibc floor
    # Guards the support floor of every Linux artifact this project
    # publishes. A Linux target in `release.yml`'s build matrix without
    # `cross: true` is compiled against the `ubuntu-latest` runner's
    # glibc, which produces an archive that installs cleanly on the
    # runner and then fails to start on any older distribution
    # ("version `GLIBC_2.39' not found"). The desktop bundles have the
    # same failure from the same cause, expressed as a runner label
    # rather than a container: they link the build host's webkit2gtk, so
    # their matrices pin `ubuntu-22.04` (ADR-0056). Nothing on a PR
    # would notice either one: `readme-smoke.yml` only ever exercises
    # `ubuntu-latest`, so the first report comes from a user. This job
    # answers the config half of both questions on every PR — including
    # for `desktop-release.yml`, which has no pull_request trigger of
    # its own; the "Verify glibc floor" steps in `release.yml` and the
    # desktop build composite answer the artifact half before anything
    # is published.
    #
    # Guarantee-style check per `.claude/rules/ci-parallelization.md`
    # §3 — no paths: filter, runs on every PR. Python-only, sub-second
    # wall clock; no rust-cache needed (§2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check the release and desktop matrices hold their floors
        run: python3 scripts/check-glibc-floor.py

      - name: Unit tests
        run: python3 -m unittest scripts/test_check_glibc_floor.py

  macports-portfile-sync:
    name: MacPorts Portfile sync
    # Guards against the `cargo.crates` block in
    # `packaging/macports/Portfile` drifting from the `Cargo.lock`
    # shipped in the source tarball that the Portfile's `github.setup`
    # line points at. The cargo portgroup downloads each crate listed
    # in `cargo.crates` and validates its checksum against what the
    # tarball's lockfile demands; if the two are out of sync, the
    # upstream MacPorts build fails with "checksum mismatch on
    # <crate>" before any compilation begins. This is therefore a
    # tag-relative check: HEAD's Cargo.lock is irrelevant — the only
    # lockfile that matters is the one inside the tarball.
    # Same guarantee-style trigger as `fixture-counts`: runs on every
    # PR, no path filter, Python-only, < 1 s wall clock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Need the tagged commit reachable so `git show
          # vX.Y.Z:Cargo.lock` works inside the regen script. The
          # script auto-detects the tag from the Portfile's
          # `github.setup` line, so no explicit tag wiring is needed
          # here.
          fetch-depth: 0

      - name: Verify Portfile cargo.crates matches tagged Cargo.lock
        run: python3 scripts/macports-regen-cargo-crates.py --check

      - name: Unit tests for the regen script
        run: python3 -m unittest scripts/test_macports_regen_cargo_crates.py

  release-publish-steps:
    name: Release publication steps
    # Exercises the code that only ever runs during a release fan-out: the
    # two `.github/actions/chocolatey-*` composite actions — the PowerShell
    # that decides whether a Chocolatey moderation queue fails a release or
    # merely annotates it, and the bash that fills the package templates
    # from `checksums.txt` — plus the equivalent checksum-extracting steps
    # `post-release.yml` carries for Homebrew, Scoop, AUR and Flathub.
    # Nothing on a PR would catch a regression in any of it until the next
    # release broke, which is the failure mode that left the 403 handling in
    # only one of the two Chocolatey callers to begin with (#1852).
    #
    # The step bodies run under this runner's `pwsh` (7.6.5 on ubuntu-24.04)
    # and `bash` with `choco`, the Chocolatey feed, and the workspace
    # stubbed; what they exercise is HTTP status handling, string matching,
    # exit codes, and template substitution, none of which is
    # Windows-specific. Guarantee-style check per
    # `.claude/rules/ci-parallelization.md` §3 — no paths: filter, runs on
    # every PR. Python + pwsh only, no Rust compiled, so no rust-cache entry
    # is needed (§2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The suite skips its pwsh-backed cases when no interpreter is present,
      # so that the repo's other Python unit tests still run on a machine
      # without PowerShell. That fallback must not silently hollow out this
      # job if pwsh ever leaves the runner image — fail loudly instead.
      - name: Verify pwsh is available
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Unit tests
        run: |
          python3 -m unittest \
            scripts/test_chocolatey_pack_push.py \
            scripts/test_chocolatey_generate_package.py \
            scripts/test_release_checksum_guards.py

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.88.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        # See the clippy job for the `chordsketch-desktop` exclusion rationale.
        run: cargo test --workspace --exclude chordsketch-desktop

      - name: Run feature-gated tests (chordsketch-render-ireal --features png,pdf)
        # The `png` (#2064) and `pdf` (#2063) features are both off
        # by default to keep the transitive-dep surface small for
        # SVG-only consumers. Without an explicit feature pass here
        # the `tests/png.rs` and `tests/pdf.rs` suites never compile
        # in CI; a regression in either pipeline would slip through
        # unnoticed. Both features share the same `usvg` 0.43 line
        # so this single test run does not double-compile the SVG
        # parser stack.
        run: cargo test -p chordsketch-render-ireal --features png,pdf

  desktop-smoke:
    name: Desktop smoke (Linux)
    # End-to-end smoke for the `chordsketch-desktop` app:
    #   1. Build `@chordsketch/wasm` (web + node dual-package) so the
    #      Vite alias in `apps/desktop/vite.config.ts` has a target.
    #   2. `npm ci` + `npm run build` inside `apps/desktop/` (runs `tsc`
    #      + `vite build`) to prove the WebView frontend type-checks
    #      and bundles against the shared `@chordsketch/react` source.
    #   3. `cargo check -p chordsketch-desktop --all-targets` on the
    #      Tauri Rust side, with webkit2gtk installed.
    # Guarantees both halves of the desktop stack compile on every PR,
    # while the cross-platform bundle build matrix stays tracked in
    # #2077. Per `.claude/rules/ci-parallelization.md` §3, this runs
    # without a `paths:` filter so any workspace or dep change is
    # exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: desktop-smoke-x86_64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          # Multiline glob — `setup-node`'s `cache-dependency-path`
          # accepts a newline-separated list, and both lockfiles
          # participate in the cache key. This is a step up from the
          # pre-#2072 single-lockfile pin, which would have missed a
          # `tree-sitter-chordpro` dep bump.
          cache-dependency-path: |
            apps/desktop/package-lock.json
            packages/tree-sitter-chordpro/package-lock.json

      - name: Build @chordsketch/wasm (lean, dual-package layout)
        # Same canonical build used by `deploy-playground.yml`.
        run: npm run build
        working-directory: packages/npm

      # The desktop app uses `render_pdf` synchronously in
      # apps/desktop/src/main.ts, so its Vite alias points
      # `@chordsketch/wasm` at the HEAVY bundle (#2466). Build it
      # here so the alias resolves at desktop-build time.
      - name: Build @chordsketch/wasm-export (heavy)
        run: npm run build
        working-directory: packages/npm-export

      - name: Install tree-sitter-chordpro grammar deps
        # `apps/desktop`'s `prebuild` script runs `tree-sitter build
        # --wasm` against this grammar package to produce
        # `tree-sitter-chordpro.wasm` (served at the Vite public
        # root for the CodeMirror editor). The tree-sitter CLI is a
        # devDependency of `packages/tree-sitter-chordpro/`, so the
        # prebuild needs this install first.
        run: npm ci
        working-directory: packages/tree-sitter-chordpro

      - name: Build @chordsketch/react
        # The desktop's `tsconfig.json` `paths` mapping points
        # `@chordsketch/react` at `packages/react/dist/index.d.ts`,
        # so `tsc` requires a built React package to type-check the
        # desktop frontend. Install + build here ahead of the
        # desktop's `npm run build` step (#2527).
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: packages/react

      - name: Install desktop frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Build desktop frontend (prebuild + tsc + vite)
        # `npm run build` runs the `prebuild` hook which builds the
        # grammar wasm; then `tsc && vite build` produces the Vite
        # bundle under `apps/desktop/dist/`.
        run: npm run build
        working-directory: apps/desktop

      - name: cargo check
        run: cargo check -p chordsketch-desktop --all-targets
