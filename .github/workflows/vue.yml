name: "@chordsketch/vue"

# Typecheck, test, and build the @chordsketch/vue package on every
# PR that touches it, plus pushes to main for post-merge verification.
# Publishing is not handled here: the package publishes with every
# release, from `publish-registries.yml` (ADR-0073).
#
# The package's lockfile installs @chordsketch/wasm from the in-tree
# `packages/npm` rather than from npm (ADR-0073), so the tests run
# against the wasm this commit would release. That directory holds only
# the manifest until it is built, so the wasm bundle is built before the
# tests, as `react.yml` does.

on:
  push:
    branches: [main]
    paths:
      - 'packages/vue/**'
      - '.github/workflows/vue.yml'
      # The `wasm-pack` pin the in-tree wasm build below consumes
      # through the composite action (#2225).
      - '.github/actions/install-wasm-pack/action.yml'
  pull_request:
    paths:
      - 'packages/vue/**'
      - '.github/workflows/vue.yml'
      # The `wasm-pack` pin the in-tree wasm build below consumes
      # through the composite action (#2225).
      - '.github/actions/install-wasm-pack/action.yml'

# Cancel stale PR runs on force-push / rebase. Main / workflow_dispatch
# runs always go to completion (gated on pull_request event).
concurrency:
  group: vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: packages/vue

jobs:
  build-and-test:
    name: Build and test @chordsketch/vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: vue-wasm32-unknown-unknown
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/vue/package-lock.json

      - name: Build in-tree wasm bundle
        run: npm run build
        working-directory: packages/npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run vitest tests
        run: npm test

      - name: Build (tsup ESM + CJS + .d.ts)
        run: npm run build

      - name: Verify dist/ contents
        run: |
          set -euo pipefail
          test -f dist/index.js     # ESM
          test -f dist/index.cjs    # CJS
          test -f dist/index.d.ts   # Types for the ESM branch
          test -f dist/index.d.cts  # Types for the CJS branch (exports."."["require"].types)
          test -f dist/styles.css   # Component stylesheet
          echo "dist/ contents:"
          ls -la dist/
