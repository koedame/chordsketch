name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the maintainer (unchidev) can start a run, and only from a pull
    # request: a comment on a plain issue does not start one, and opening or
    # assigning an issue is not a trigger at all. The `@claude` requests posted
    # by claude-review.yml and auto-resolve-conflicts.yml go through CLAUDE_PAT,
    # which belongs to unchidev, so they pass this check as well.
    # What Claude reads is limited in the same way: see
    # `include_comments_by_actor` on the action below.
    if: |
      github.event.sender.login == 'unchidev' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Use CLAUDE_PAT so that git pushes by Claude trigger CI workflows.
      # GITHUB_TOKEN pushes do not trigger other workflows (GitHub anti-loop).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CLAUDE_PAT }}
          fetch-depth: 1

      # On a pull request, Claude checks out its head and works on it.
      # Outside pull requests are not accepted, so only a pull
      # request whose head is a branch of this repository goes on.
      - name: Only pull requests from this repository
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash .github/scripts/require-same-repo-pr.sh "$PR"

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_PAT }}
          track_progress: true
          # Only comments, reviews and review comments written by the
          # maintainer are passed to Claude as context; those from other
          # accounts are left out of the prompt.
          include_comments_by_actor: unchidev
          # Commits Claude pushes to a pull request are authored as the
          # maintainer, the account CLAUDE_PAT belongs to and the one that
          # starts every run. With the action's default bot identity, each
          # squash merge added a bot co-author trailer to the commit on main.
          bot_name: unchidev
          bot_id: "69432552"
          # `--permission-mode acceptEdits` is the mode the action itself sets
          # for a run that `track_progress` puts on its `@claude`-mention path,
          # which is every run of this job. It is spelled out so the mode does
          # not follow the action's default: `claude_args` is appended after
          # the action's own arguments and the last `--permission-mode` wins.
          # In this mode a tool call that no `--allowedTools` rule covers is
          # denied, so the list below stays a strict list.
          claude_args: "--permission-mode acceptEdits --allowedTools Edit,Write,Read,Bash"
          settings: '{"attribution": {"commit": "", "pr": "", "sessionUrl": false}}'
          prompt: |
            Write everything in English (code, comments, commit messages, PR text).
