name: Chocolatey Retry Push

# Re-runs only the Chocolatey pack-and-push step from post-release.yml.
#
# Use this when post-release.yml's `update-chocolatey` job fails (e.g.
# 403 Forbidden because the previous version is still in Chocolatey
# community moderation) while the other 7 jobs succeeded. Re-dispatching
# the whole post-release.yml would duplicate non-idempotent side effects
# in AUR, Flathub, Snap, CocoaPods, Homebrew, Scoop, and Swift.
#
# See #1852 (original v0.2.2 failure) and #2030 (this workflow).
#
# Both dispatches this workflow has ever had (2026-04-21, for v0.2.2)
# failed, because 0.2.1 was still queued for a human moderator and
# Chocolatey rejects a newer version while that is true. The push path
# itself is sound: the identical step in post-release.yml published
# 0.5.0 on 2026-05-20 once the queue had drained. What was missing is
# that neither run said any of this - the job surfaced a bare "Process
# completed with exit code 1", so the one condition this workflow exists
# to recover from had to be diagnosed by hand off the package page, and
# #1852 reached the wrong conclusion once on the way. The push step
# below reads the status back out of `choco push` and reports it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to Chocolatey (e.g., v0.2.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  push-chocolatey:
    name: Retry Chocolatey push
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt

      - name: Generate package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA_WINDOWS=$(grep "x86_64-pc-windows-msvc" checksums.txt | awk '{print $1}')

          if [[ ! "$SHA_WINDOWS" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: missing or invalid SHA256 for x86_64-pc-windows-msvc: '${SHA_WINDOWS}'" >&2
            exit 1
          fi

          mkdir -p choco-pkg/tools

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            packaging/chocolatey/chordsketch.nuspec.template > choco-pkg/chordsketch.nuspec

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA256_X86_64_PC_WINDOWS_MSVC}}/${SHA_WINDOWS}/g" \
            packaging/chocolatey/tools/chocolateyInstall.ps1.template > choco-pkg/tools/chocolateyInstall.ps1

          echo "=== chordsketch.nuspec ==="
          cat choco-pkg/chordsketch.nuspec
          echo "=== chocolateyInstall.ps1 ==="
          cat choco-pkg/tools/chocolateyInstall.ps1

      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Set-Location choco-pkg
          choco pack chordsketch.nuspec
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::choco pack failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

          $nupkg = "chordsketch.$env:VERSION.nupkg"
          if (-not (Test-Path -LiteralPath $nupkg)) {
            Write-Host "::error::choco pack reported success but $nupkg is missing."
            exit 1
          }

      - name: Push
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $page = "https://community.chocolatey.org/packages/chordsketch/$env:VERSION"

          # post-release.yml can afford to no-op this channel when the key
          # is absent, because it is one job of eight in an automatic
          # fan-out. This workflow is dispatched by hand for the sole
          # purpose of pushing, so reporting success without having pushed
          # anything would be a false all-clear.
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Host "::error::CHOCOLATEY_API_KEY is not set on this repository. Set it (gh secret set CHOCOLATEY_API_KEY -R koedame/chordsketch) and dispatch again."
            exit 1
          }

          # A retry gets dispatched repeatedly while a moderation queue
          # drains, so a version that already landed must not read as a
          # failure. The v2 feed answers 200 for a version the repository
          # holds and 404 for one it never accepted (checked against 0.5.0
          # and 0.2.1 vs 0.4.0 and 0.2.2). Anything else means the feed
          # could not be read, which is not itself a reason to refuse to
          # push - fall through and let the push decide.
          $feed = "https://community.chocolatey.org/api/v2/Packages(Id='chordsketch',Version='$env:VERSION')"
          try {
            $probe = Invoke-WebRequest -Uri $feed -SkipHttpErrorCheck
            switch ($probe.StatusCode) {
              200 {
                Write-Host "::notice::chordsketch $env:VERSION is already on the Chocolatey Community Repository; nothing to push. $page"
                exit 0
              }
              404 {
                Write-Host "chordsketch $env:VERSION is not on the repository yet; pushing."
              }
              default {
                Write-Host "::warning::Could not read the Chocolatey feed (HTTP $($probe.StatusCode)); pushing without the pre-flight check."
              }
            }
          } catch {
            # -SkipHttpErrorCheck covers 4xx/5xx answers; a DNS failure or
            # timeout still throws, and the runner's 'Stop' preference is
            # in effect here, so it would abort the step instead.
            Write-Host "::warning::Could not reach the Chocolatey feed ($_); pushing without the pre-flight check."
          }

          # `choco push` collapses every rejection into exit code 1 and
          # carries the HTTP status in its output only, so the output has
          # to be captured to say anything useful about the failure. The
          # runner's pwsh wrapper sets $ErrorActionPreference = 'Stop',
          # which on PowerShell 7.4+ aborts the step on a non-zero native
          # exit before any of that can be read back.
          # Set-Location stays above the preference change so a missing
          # directory still stops the step outright.
          Set-Location choco-pkg

          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $output = & choco push "chordsketch.$env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output

          if ($code -eq 0) {
            Write-Host "::notice::Pushed chordsketch $env:VERSION. It stays unlisted until a moderator approves it: $page"
            exit 0
          }

          if ($output -match '409 \(Conflict\)') {
            Write-Host "::notice::The repository already holds chordsketch $env:VERSION (HTTP 409); nothing to do. $page"
            exit 0
          }

          if ($output -match '403 \(Forbidden\)') {
            Write-Host "::error::choco push was refused with HTTP 403. The usual cause is an earlier version still queued for community moderation, which blocks every newer push until a moderator clears it (#1852). Open $page and read 'Package Status': 'Submitted' means still queued, and the review-timeline badge reads 'Ready for review' in that state - only an approved package unblocks this push. Dispatch again once it clears. If the earlier version is already approved, check the API key next: https://community.chocolatey.org/account"
            exit 1
          }

          Write-Host "::error::choco push failed with exit code $code; see the step output above."
          exit $code
