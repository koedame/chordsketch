name: Chocolatey Retry Push

# Re-runs only the Chocolatey pack-and-push step from post-release.yml.
#
# Use this when post-release.yml's `update-chocolatey` job fails (e.g.
# 403 Forbidden because the previous version is still in Chocolatey
# community moderation) while the other 7 jobs succeeded. Re-dispatching
# the whole post-release.yml would duplicate non-idempotent side effects
# in AUR, Flathub, Snap, CocoaPods, Homebrew, Scoop, and Swift.
#
# See #1852 (original v0.2.2 failure) and #2030 (this workflow).
#
# The two v0.2.2 dispatches on 2026-04-21 both failed, because 0.2.1 was
# still queued for a human moderator and Chocolatey rejects a newer
# version while that is true. The push path itself is sound: the
# equivalent step in post-release.yml published 0.5.0 on 2026-05-20
# once the queue had drained. What was missing is that neither run said
# any of this - the job surfaced a bare "Process completed with exit
# code 1", so the one condition this workflow exists to recover from had
# to be diagnosed by hand off the package page, and #1852 reached the
# wrong conclusion once on the way.
#
# The reporting now lives in the `chocolatey-pack-push` composite action,
# which post-release.yml calls too, so the release path cannot fall back
# to a bare `choco push` that reports nothing. The two callers differ
# only in how they dispose of a missing key and of a 403.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to Chocolatey (e.g., v0.2.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  push-chocolatey:
    name: Retry Chocolatey push
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt

      - name: Generate package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA_WINDOWS=$(grep "x86_64-pc-windows-msvc" checksums.txt | awk '{print $1}')

          if [[ ! "$SHA_WINDOWS" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: missing or invalid SHA256 for x86_64-pc-windows-msvc: '${SHA_WINDOWS}'" >&2
            exit 1
          fi

          mkdir -p choco-pkg/tools

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            packaging/chocolatey/chordsketch.nuspec.template > choco-pkg/chordsketch.nuspec

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA256_X86_64_PC_WINDOWS_MSVC}}/${SHA_WINDOWS}/g" \
            packaging/chocolatey/tools/chocolateyInstall.ps1.template > choco-pkg/tools/chocolateyInstall.ps1

          echo "=== chordsketch.nuspec ==="
          cat choco-pkg/chordsketch.nuspec
          echo "=== chocolateyInstall.ps1 ==="
          cat choco-pkg/tools/chocolateyInstall.ps1

      - name: Pack and push
        # Shared with post-release.yml's `update-chocolatey` job so the
        # release path and this by-hand retry path cannot diverge. The
        # dispositions below are this workflow's half of that contract:
        # it is dispatched for the sole purpose of pushing, so reporting
        # success without having pushed anything would be a false
        # all-clear - a missing key and a 403 both fail the run.
        uses: ./.github/actions/chocolatey-pack-push
        with:
          version: ${{ steps.version.outputs.version }}
          api-key: ${{ secrets.CHOCOLATEY_API_KEY }}
          on-missing-key: fail
          on-forbidden: fail
