name: Swift Package

on:
  push:
    branches: [main]
    paths:
      - "crates/ffi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "packages/swift/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift.yml"
      - ".github/actions/rust-cache/action.yml"
  pull_request:
    paths:
      - "crates/ffi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "packages/swift/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift.yml"
      - ".github/actions/rust-cache/action.yml"
  # Reusable: called by release.yml's fan-out after the GitHub Release
  # exists, so `publish` has a release to upload the xcframework to and
  # the two package updates below can depend on that upload with
  # `needs:` instead of polling for it (ADR-0039, ADR-0067). A non-empty
  # `tag` is what puts this workflow in release mode; on `push` /
  # `pull_request` it is empty and only build + test run.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0). Format-validated by the caller."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g., v0.1.0). Leave empty to build from the workflow's ref without publishing."
        required: false
        type: string

# Cancel stale PR runs when a new commit is pushed to the same PR so
# that rebase / force-push does not leave two parallel Swift builds
# competing for the macOS 5-job concurrency cap. `main` pushes and
# `workflow_dispatch` / `workflow_call` runs are not grouped with PRs
# and run to completion.
concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Ensure `run:` blocks use `bash -eo pipefail`, not the silent default that
# swallows mid-pipe failures. swift.yml has no Windows matrix, so a
# workflow-level default is safe (fix-propagation from PR #1821, issue #1845).
# `-u` is added on top (issue #1836) so a typo'd env-var reference fails
# loud; every block in this workflow already runs `set -euo pipefail`
# explicitly, making the default strictly defense-in-depth.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Build each Apple target on its own runner in parallel.
  # The aarch64-apple-darwin cell also produces the dylib that uniffi-bindgen
  # needs in the assemble job. All five cells upload a static library artifact;
  # the aarch64-apple-darwin cell additionally uploads the dylib.
  #
  # Per-target shared-key avoids cache thrashing: different targets produce
  # different compiled objects and polluting a shared key forces cache misses.
  build-target:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    # Intentionally fail-closed: if any Apple target fails, the
    # downstream `assemble-xcframework` + `publish` jobs are skipped.
    # XCFramework is a sealed container of per-platform static
    # libraries; missing a triple produces an incomplete framework
    # that breaks Swift consumers on that platform at link time.
    # Blocking the release until every cell succeeds is the safer
    # failure mode. Contrast with `vscode-extension.yml
    # build-platform`, which has a universal VSIX fallback (#1795).
    # See #1806.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
          - target: aarch64-apple-ios
          - target: aarch64-apple-ios-sim
          - target: x86_64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: swift-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build library for ${{ matrix.target }}
        run: cargo build -p chordsketch-ffi --release --target ${{ matrix.target }}

      - name: Upload static library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-lib-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libchordsketch_ffi.a
          retention-days: 1
          if-no-files-found: error

      # The dylib is only produced for the macOS target and is only needed in
      # the assemble job to let uniffi-bindgen extract the library metadata.
      - name: Upload dylib (aarch64-apple-darwin only, for uniffi-bindgen)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-dylib-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/libchordsketch_ffi.dylib
          retention-days: 1
          if-no-files-found: error

  # Download the 5 static libraries and dylib built in parallel above, then
  # assemble the XCFramework, generate Swift bindings, and run swift test.
  # Uses rust-cache (shared-key: swift-assemble) to avoid recompiling the
  # uniffi-bindgen host binary on every run.
  assemble-xcframework:
    name: Assemble XCFramework
    needs: [build-target]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When triggered via workflow_dispatch with a tag input, build
          # from that tag rather than the workflow's default ref. This
          # is what allows historical tags (e.g., v0.1.0) to be re-built
          # for one-shot remediation. For other triggers, fall through
          # to github.ref via the OR fallback.
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # Cache the workspace target/ so that the uniffi-bindgen host binary
      # is compiled once and reused. Without this, every assemble run
      # re-compiles uniffi-bindgen (~60s cold; 0s warm).
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: swift-assemble
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download static libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swift-lib-*
          # Each artifact downloads to its own subdirectory, e.g.:
          # swift-lib-aarch64-apple-darwin/libchordsketch_ffi.a
          # swift-lib-x86_64-apple-darwin/libchordsketch_ffi.a
          # etc.

      - name: Download dylib for uniffi-bindgen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-dylib-aarch64-apple-darwin
          # Downloads libchordsketch_ffi.dylib to CWD

      - name: Generate Swift bindings
        run: |
          cargo run -p chordsketch-ffi --bin uniffi-bindgen generate \
            --library libchordsketch_ffi.dylib \
            --language swift \
            --out-dir generated

      - name: Create universal libraries
        run: |
          # macOS universal (arm64 + x86_64)
          mkdir -p universal/macos
          lipo -create \
            swift-lib-aarch64-apple-darwin/libchordsketch_ffi.a \
            swift-lib-x86_64-apple-darwin/libchordsketch_ffi.a \
            -output universal/macos/libchordsketch_ffi.a

          # iOS simulator universal (arm64 + x86_64)
          mkdir -p universal/ios-sim
          lipo -create \
            swift-lib-aarch64-apple-ios-sim/libchordsketch_ffi.a \
            swift-lib-x86_64-apple-ios/libchordsketch_ffi.a \
            -output universal/ios-sim/libchordsketch_ffi.a

      - name: Set up module map for XCFramework
        run: |
          mkdir -p generated/include
          # Use the UniFFI-generated modulemap which correctly declares
          # `module` (not `framework module`) for the static library and
          # includes the necessary `use` declarations for the C standard library.
          cp generated/chordsketchFFI.modulemap generated/include/module.modulemap
          cp generated/chordsketchFFI.h generated/include/

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library universal/macos/libchordsketch_ffi.a \
            -headers generated/include \
            -library swift-lib-aarch64-apple-ios/libchordsketch_ffi.a \
            -headers generated/include \
            -library universal/ios-sim/libchordsketch_ffi.a \
            -headers generated/include \
            -output chordsketchFFI.xcframework

      - name: Copy generated Swift source
        run: |
          cp generated/chordsketch.swift packages/swift/Sources/ChordSketch/

      - name: Run Swift tests
        run: |
          # Copy XCFramework into the Swift package directory
          cp -R chordsketchFFI.xcframework packages/swift/

          # Replace only the binaryTarget in Package.swift with a local path,
          # preserving any other changes to the file (platforms, products, etc.).
          # Uses parenthesis counting (not regex) so URLs/checksums containing
          # literal `)` are handled correctly.
          python3 << 'PYTHON'
          import re
          path = "packages/swift/Package.swift"
          with open(path) as f:
              content = f.read()

          # Find the start of .binaryTarget(... for chordsketchFFI
          header_re = re.compile(
              r'\.binaryTarget\(\s*name:\s*"chordsketchFFI"',
              re.DOTALL,
          )
          match = header_re.search(content)
          if not match:
              raise SystemExit("Could not find .binaryTarget for chordsketchFFI")

          # Walk forward, counting parens, to find the matching close paren.
          # Skip parens that appear inside Swift "..." string literals so
          # URLs like "https://example.com/v1.0).zip" don't fool the counter.
          # Also handles \" escape sequences inside strings.
          start = match.start()
          # The opening `(` is part of `.binaryTarget(`
          paren_pos = content.index('(', start)
          depth = 1
          i = paren_pos + 1
          in_string = False
          while i < len(content) and depth > 0:
              ch = content[i]
              if in_string:
                  if ch == '\\' and i + 1 < len(content):
                      # Skip the escaped character.
                      i += 2
                      continue
                  if ch == '"':
                      in_string = False
              else:
                  if ch == '"':
                      in_string = True
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
              i += 1
          if depth != 0:
              raise SystemExit("Unbalanced parentheses in .binaryTarget block")
          end = i  # one past the closing `)`

          # Verify there is no second .binaryTarget for chordsketchFFI elsewhere.
          if header_re.search(content, end):
              raise SystemExit(
                  "Found more than one .binaryTarget for chordsketchFFI"
              )

          replacement = (
              '.binaryTarget(\n'
              '            name: "chordsketchFFI",\n'
              '            path: "chordsketchFFI.xcframework"\n'
              '        )'
          )
          new_content = content[:start] + replacement + content[end:]
          with open(path, "w") as f:
              f.write(new_content)
          PYTHON

          cd packages/swift
          swift test

      - name: Package XCFramework
        run: |
          zip -r chordsketch-xcframework.zip chordsketchFFI.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework
          path: chordsketch-xcframework.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload Swift source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-source
          path: generated/chordsketch.swift
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish XCFramework
    needs: [assemble-xcframework]
    runs-on: ubuntu-latest
    # `inputs.tag`, not the event: under `workflow_call` the event is the
    # caller's `push`, indistinguishable from a push to main (ADR-0039).
    if: inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Needed so the composite action at
        # `.github/actions/validate-release-tag` is present on disk.
        # actions/download-artifact below places the xcframework zip
        # at the workspace root next to the checked-out tree.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcframework

      - name: Validate release tag
        # Format-validate the tag before `gh release upload` sees it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" chordsketch-xcframework.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  update-cocoapods:
    name: Update CocoaPods podspec
    # `pod trunk push` validates the podspec by downloading its
    # `:http` source — the xcframework zip on the release — so it can
    # only run once `publish` has uploaded it. When this job lived in
    # post-release.yml it raced the upload and failed on the 404
    # (v0.6.0; ADR-0067).
    needs: [publish]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Generate podspec
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -e "s/{{VERSION}}/${VERSION}/g" \
            packaging/cocoapods/ChordSketch.podspec.template > ChordSketch.podspec
          cat ChordSketch.podspec

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "COCOAPODS_TRUNK_TOKEN secret is not set; skipping CocoaPods push."
            echo "To enable automatic CocoaPods updates, add the trunk token"
            echo "as a repository secret named COCOAPODS_TRUNK_TOKEN."
            exit 0
          fi

          pod trunk push ChordSketch.podspec --allow-warnings

  update-swift-package:
    name: Update Swift Package.swift
    # Downloads the asset `publish` uploads, so it follows `publish`
    # rather than polling the release for it.
    needs: [publish]
    runs-on: ubuntu-latest
    # Note: this job pushes a branch and opens a PR. The default
    # GITHUB_TOKEN cannot trigger downstream workflows on pushes / PR
    # creation, which would leave the auto-generated PR with no CI runs
    # and block the human merger from getting a green check. Use
    # CLAUDE_PAT (the same token that auto-rebase.yml and claude.yml use
    # for the "git pushes by Claude trigger CI" path) so that the
    # generated PR fires CI normally. The job-level GITHUB_TOKEN is
    # therefore left at its read default — it is not used for the push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.CLAUDE_PAT }}

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Download xcframework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern chordsketch-xcframework.zip

      - name: Compute checksum
        id: checksum
        run: |
          # Swift Package Manager uses SHA256 of the zip file (same as
          # `swift package compute-checksum chordsketch-xcframework.zip`,
          # which is just sha256sum of the zip).
          SHA=$(sha256sum chordsketch-xcframework.zip | awk '{print $1}')
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: invalid SHA256 computed: '${SHA}'" >&2
            exit 1
          fi
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: ${SHA}"

      - name: Update Package.swift
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          # Rewrite the .binaryTarget block's url and checksum fields
          # using paren-counting (matching the approach in the
          # assemble-xcframework job above) so URLs/checksums containing literal `)` are
          # handled correctly.
          python3 << 'PYTHON'
          import os
          import re

          tag = os.environ["TAG"]
          sha256 = os.environ["SHA256"]
          path = "packages/swift/Package.swift"

          with open(path) as f:
              content = f.read()

          header_re = re.compile(
              r'\.binaryTarget\(\s*name:\s*"chordsketchFFI"',
              re.DOTALL,
          )
          match = header_re.search(content)
          if not match:
              raise SystemExit("Could not find .binaryTarget for chordsketchFFI")

          start = match.start()
          paren_pos = content.index('(', start)
          depth = 1
          i = paren_pos + 1
          in_string = False
          while i < len(content) and depth > 0:
              ch = content[i]
              if in_string:
                  if ch == '\\' and i + 1 < len(content):
                      i += 2
                      continue
                  if ch == '"':
                      in_string = False
              else:
                  if ch == '"':
                      in_string = True
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
              i += 1
          if depth != 0:
              raise SystemExit("Unbalanced parentheses in .binaryTarget block")
          end = i

          if header_re.search(content, end):
              raise SystemExit("Found more than one .binaryTarget for chordsketchFFI")

          replacement = (
              '.binaryTarget(\n'
              '            name: "chordsketchFFI",\n'
              f'            url: "https://github.com/koedame/chordsketch/releases/download/{tag}/chordsketch-xcframework.zip",\n'
              f'            checksum: "{sha256}"\n'
              '        )'
          )
          new_content = content[:start] + replacement + content[end:]
          with open(path, "w") as f:
              f.write(new_content)
          PYTHON
          cat packages/swift/Package.swift

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          BRANCH="swift-package-update-${VERSION}"

          # Configure committer identity for github-actions[bot].
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If the file is unchanged (e.g., re-run on same release), do nothing.
          if git diff --quiet packages/swift/Package.swift; then
            echo "Package.swift already up-to-date for ${TAG}; nothing to do."
            exit 0
          fi

          # If the branch already exists on the remote (e.g., re-run),
          # delete it so we can recreate it cleanly.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH"
          fi

          git checkout -b "$BRANCH"
          git add packages/swift/Package.swift
          git commit -m "Update Swift Package.swift to ${TAG}"
          git push -u origin "$BRANCH"

          BODY=$(cat <<BODY_EOF
          ## What

          Updates \`packages/swift/Package.swift\`'s \`.binaryTarget\` to point to
          the \`${TAG}\` xcframework asset and pin its SHA256.

          - **Tag**: \`${TAG}\`
          - **Asset**: \`chordsketch-xcframework.zip\`
          - **SHA256**: \`${SHA256}\`

          ## Why

          Auto-generated by \`swift.yml\`'s \`update-swift-package\` job
          after its \`publish\` job uploaded the xcframework to the release.
          Without this update, \`swift package add https://github.com/koedame/chordsketch.git\`
          against the new tag would fail with an invalid checksum error.

          See #1062.
          BODY_EOF
          )

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update Swift Package.swift to ${TAG}" \
            --body "$BODY"
