name: Swift Package

on:
  push:
    branches: [main]
    paths:
      - "crates/ffi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "packages/swift/**"
      - "Package.swift"
      - "scripts/swift_package.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift.yml"
      - ".github/actions/rust-cache/action.yml"
  pull_request:
    paths:
      - "crates/ffi/**"
      - "crates/chordpro/**"
      - "crates/render-*/**"
      - "packages/swift/**"
      - "Package.swift"
      - "scripts/swift_package.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/swift.yml"
      - ".github/actions/rust-cache/action.yml"
  # Reusable: called by release.yml's fan-out after the GitHub Release
  # exists. A non-empty `tag` is what puts this workflow in release mode:
  # `publish` uploads the XCFramework that was built and pinned in
  # `Package.swift` *before* the tag (ADR-0080), and CocoaPods follows the
  # upload with `needs:` instead of polling for it (ADR-0039, ADR-0067).
  # Nothing is built in release mode. On `push` / `pull_request` `tag` is
  # empty and only build + test run.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0). Format-validated by the caller."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Upload the XCFramework pinned in the tag's Package.swift to that release again (e.g., v0.1.0). Leave empty to build without publishing."
        required: false
        type: string
      pin:
        description: "Version to pin (e.g., 0.8.0). Run it on the release branch, after the version bump: it builds the XCFramework and commits its checksum into Package.swift there. Leave empty otherwise."
        required: false
        type: string

# Cancel stale PR runs when a new commit is pushed to the same PR so
# that rebase / force-push does not leave two parallel Swift builds
# competing for the macOS 5-job concurrency cap. `main` pushes and
# `workflow_dispatch` / `workflow_call` runs are not grouped with PRs
# and run to completion.
concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Ensure `run:` blocks use `bash -eo pipefail`, not the silent default that
# swallows mid-pipe failures. swift.yml has no Windows matrix, so a
# workflow-level default is safe (fix-propagation from PR #1821, issue #1845).
# `-u` is added on top (issue #1836) so a typo'd env-var reference fails
# loud; every block in this workflow already runs `set -euo pipefail`
# explicitly, making the default strictly defense-in-depth.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Build each Apple target on its own runner in parallel.
  # The aarch64-apple-darwin cell also produces the dylib that uniffi-bindgen
  # needs in the assemble job. All five cells upload a static library artifact;
  # the aarch64-apple-darwin cell additionally uploads the dylib.
  #
  # Per-target shared-key avoids cache thrashing: different targets produce
  # different compiled objects and polluting a shared key forces cache misses.
  build-target:
    name: Build ${{ matrix.target }}
    # Release mode publishes the XCFramework that was pinned before the tag;
    # rebuilding it here would produce a different zip than the checksum.
    if: inputs.tag == ''
    runs-on: macos-latest
    # Intentionally fail-closed: if any Apple target fails, the
    # downstream `assemble-xcframework` + `publish` jobs are skipped.
    # XCFramework is a sealed container of per-platform static
    # libraries; missing a triple produces an incomplete framework
    # that breaks Swift consumers on that platform at link time.
    # Blocking the release until every cell succeeds is the safer
    # failure mode. Contrast with `vscode-extension.yml
    # build-platform`, which has a universal VSIX fallback (#1795).
    # See #1806.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
          - target: aarch64-apple-ios
          - target: aarch64-apple-ios-sim
          - target: x86_64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/rust-cache
        with:
          shared-key: swift-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build library for ${{ matrix.target }}
        run: cargo build -p chordsketch-ffi --release --target ${{ matrix.target }}

      - name: Upload static library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-lib-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libchordsketch_ffi.a
          retention-days: 1
          if-no-files-found: error

      # The dylib is only produced for the macOS target and is only needed in
      # the assemble job to let uniffi-bindgen extract the library metadata.
      - name: Upload dylib (aarch64-apple-darwin only, for uniffi-bindgen)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-dylib-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/libchordsketch_ffi.dylib
          retention-days: 1
          if-no-files-found: error

  # Download the 5 static libraries and dylib built in parallel above, then
  # assemble the XCFramework, generate Swift bindings, and run swift test.
  # Uses rust-cache (shared-key: swift-assemble) to avoid recompiling the
  # uniffi-bindgen host binary on every run.
  assemble-xcframework:
    name: Assemble XCFramework
    needs: [build-target]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # Cache the workspace target/ so that the uniffi-bindgen host binary
      # is compiled once and reused. Without this, every assemble run
      # re-compiles uniffi-bindgen (~60s cold; 0s warm).
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: swift-assemble
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download static libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swift-lib-*
          # Each artifact downloads to its own subdirectory, e.g.:
          # swift-lib-aarch64-apple-darwin/libchordsketch_ffi.a
          # swift-lib-x86_64-apple-darwin/libchordsketch_ffi.a
          # etc.

      - name: Download dylib for uniffi-bindgen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-dylib-aarch64-apple-darwin
          # Downloads libchordsketch_ffi.dylib to CWD

      - name: Generate Swift bindings
        run: |
          cargo run -p chordsketch-ffi --bin uniffi-bindgen generate \
            --library libchordsketch_ffi.dylib \
            --language swift \
            --out-dir generated

      - name: Create universal libraries
        run: |
          # macOS universal (arm64 + x86_64)
          mkdir -p universal/macos
          lipo -create \
            swift-lib-aarch64-apple-darwin/libchordsketch_ffi.a \
            swift-lib-x86_64-apple-darwin/libchordsketch_ffi.a \
            -output universal/macos/libchordsketch_ffi.a

          # iOS simulator universal (arm64 + x86_64)
          mkdir -p universal/ios-sim
          lipo -create \
            swift-lib-aarch64-apple-ios-sim/libchordsketch_ffi.a \
            swift-lib-x86_64-apple-ios/libchordsketch_ffi.a \
            -output universal/ios-sim/libchordsketch_ffi.a

      - name: Set up module map for XCFramework
        run: |
          mkdir -p generated/include
          # Use the UniFFI-generated modulemap which correctly declares
          # `module` (not `framework module`) for the static library and
          # includes the necessary `use` declarations for the C standard library.
          cp generated/chordsketchFFI.modulemap generated/include/module.modulemap
          cp generated/chordsketchFFI.h generated/include/

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library universal/macos/libchordsketch_ffi.a \
            -headers generated/include \
            -library swift-lib-aarch64-apple-ios/libchordsketch_ffi.a \
            -headers generated/include \
            -library universal/ios-sim/libchordsketch_ffi.a \
            -headers generated/include \
            -output chordsketchFFI.xcframework

      - name: Use the generated Swift source
        run: |
          cp generated/chordsketch.swift packages/swift/Sources/ChordSketch/

      - name: Run Swift tests
        run: |
          # Test against the XCFramework just built, not the published one.
          python3 scripts/swift_package.py use-local --path chordsketchFFI.xcframework
          swift test

      - name: Package XCFramework
        run: |
          zip -r chordsketch-xcframework.zip chordsketchFFI.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework
          path: chordsketch-xcframework.zip
          retention-days: 7
          if-no-files-found: error

      # `pin` commits this file next to the checksum: the package a
      # consumer resolves is the tag's own checkout, and UniFFI checks the
      # bindings against the XCFramework at start-up, so the two have to
      # come from the same build.
      - name: Upload Swift source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-source
          path: generated/chordsketch.swift
          retention-days: 7
          if-no-files-found: error

  # Release step 3: pin the XCFramework this run built, and the Swift
  # bindings generated for it, into the release branch, so the version-bump
  # commit that lands on `main` already names the asset and checksum its
  # tag will serve (ADR-0080). Dispatch it on the release branch after
  # `check-version-consistency.py --set`:
  #
  #   gh workflow run swift.yml --ref <release-branch> -f pin=X.Y.Z
  #
  # The zip is kept under a name that carries its checksum, for longer
  # than a release takes, because `publish` uploads that exact file
  # after the tag: a rebuild would not reproduce the checksum.
  pin:
    name: Pin XCFramework in Package.swift
    needs: [assemble-xcframework]
    if: inputs.pin != ''
    runs-on: ubuntu-latest
    # Pushes a commit to the release branch. The default GITHUB_TOKEN
    # cannot trigger the pull request's checks on that push, so it is
    # the same PAT the other release automation pushes with.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the XCFramework was built from, not the branch's
          # newest: a push in between makes the final push fail rather
          # than pin a checksum for source that is not on the branch.
          ref: ${{ github.sha }}
          token: ${{ secrets.CLAUDE_PAT }}

      - name: Validate version
        uses: ./.github/actions/validate-release-tag
        with:
          tag: v${{ inputs.pin }}

      - name: Check this is the release branch at that version
        env:
          VERSION: ${{ inputs.pin }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" = "main" ]; then
            echo "::error::Run this on the release branch (--ref <branch>), not on '$REF_NAME'."
            exit 1
          fi
          CURRENT=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/cli/Cargo.toml", "rb"))["package"]["version"])')
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::The branch is at version $CURRENT, not $VERSION. Bump it first: python3 scripts/check-version-consistency.py --set $VERSION"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcframework

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-source
          path: swift-source

      - name: Compute checksum
        id: checksum
        run: |
          SHA=$(sha256sum chordsketch-xcframework.zip | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: ${SHA}"

      - name: Keep the zip for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework-${{ steps.checksum.outputs.sha256 }}
          path: chordsketch-xcframework.zip
          retention-days: 90
          if-no-files-found: error

      # Kept beside the zip so that `scripts/release.py` can tell the
      # bindings committed on the release branch are the ones this build
      # generated, not an edited or foreign copy.
      - name: Keep the bindings for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-source-${{ steps.checksum.outputs.sha256 }}
          path: swift-source/chordsketch.swift
          retention-days: 90
          if-no-files-found: error

      - name: Commit the pin
        env:
          VERSION: ${{ inputs.pin }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/swift_package.py pin --tag "v${VERSION}" --sha256 "$SHA256"
          cp swift-source/chordsketch.swift packages/swift/Sources/ChordSketch/chordsketch.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift packages/swift/Sources/ChordSketch/chordsketch.swift
          if git diff --cached --quiet; then
            echo "The branch already pins this XCFramework and its bindings; nothing to commit."
            exit 0
          fi
          git commit -m "Pin the Swift XCFramework for v${VERSION}"
          git push origin "HEAD:refs/heads/${REF_NAME}"

  publish:
    name: Publish XCFramework
    runs-on: ubuntu-latest
    # `inputs.tag`, not the event: under `workflow_call` the event is the
    # caller's `push`, indistinguishable from a push to main (ADR-0039).
    if: inputs.tag != ''
    permissions:
      contents: write
      # Reads the artifact `pin` stored, from the run that made it.
      actions: read
    steps:
      # The tag's own checkout: its Package.swift is the manifest consumers
      # resolve, and it says which zip belongs to this release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release tag
        # Format-validate the tag before `gh release upload` sees it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.tag }}

      - name: Fetch the pinned XCFramework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f Package.swift ] || [ ! -f scripts/swift_package.py ]; then
            echo "::error::${TAG} has no root Package.swift, so no XCFramework was pinned for it. Only releases cut with the pin step (docs/releasing.md step 3) can be published from here."
            exit 1
          fi
          PIN=$(python3 scripts/swift_package.py show)
          read -r URL SHA <<< "$PIN"
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/chordsketch-xcframework.zip"
          if [ "$URL" != "$EXPECTED" ]; then
            echo "::error::Package.swift at ${TAG} points at ${URL}, not ${EXPECTED}. The XCFramework was not pinned before the tag: see docs/releasing.md step 3."
            exit 1
          fi
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=xcframework-${SHA}" \
            --jq '[.artifacts[] | select(.expired | not)] | first | .workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No unexpired artifact xcframework-${SHA}. Package.swift pins a checksum whose zip is gone, and a rebuild would not reproduce it, so this tag cannot be published as it is."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "xcframework-${SHA}"
          echo "${SHA}  chordsketch-xcframework.zip" | sha256sum --check

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" chordsketch-xcframework.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  update-cocoapods:
    name: Update CocoaPods podspec
    # `pod trunk push` validates the podspec by downloading its
    # `:http` source — the xcframework zip on the release — so it can
    # only run once `publish` has uploaded it. When this job lived in
    # post-release.yml it raced the upload and failed on the 404
    # (v0.6.0; ADR-0067).
    needs: [publish]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        # Format-validate the resolved tag before downstream `gh` /
        # shell / checksum-download steps interpolate it. See #1797.
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Generate podspec
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -e "s/{{VERSION}}/${VERSION}/g" \
            packaging/cocoapods/ChordSketch.podspec.template > ChordSketch.podspec
          cat ChordSketch.podspec

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "COCOAPODS_TRUNK_TOKEN secret is not set; skipping CocoaPods push."
            echo "To enable automatic CocoaPods updates, add the trunk token"
            echo "as a repository secret named COCOAPODS_TRUNK_TOKEN."
            exit 0
          fi

          pod trunk push ChordSketch.podspec --allow-warnings
