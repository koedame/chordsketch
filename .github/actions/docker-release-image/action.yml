name: "Build the release container image"
description: >
  Tag and build `Dockerfile.release` for linux/amd64 and linux/arm64 from
  the musl binaries staged at `./chordsketch-amd64` and
  `./chordsketch-arm64`. Shared by `docker.yml`, which pushes the image to
  GHCR on a release, and `publishable.yml`, which builds it without pushing
  on every pull request (ADR-0070).
inputs:
  tag:
    description: "Release tag the image is tagged from (e.g. v0.1.0). Format-validated by the caller."
    required: true
  promote-latest:
    description: "Also tag `:latest`."
    required: false
    default: "false"
  push:
    description: "Push the image to the registry."
    required: true
outputs:
  tags:
    description: "The image references the build was tagged with, one per line."
    value: ${{ steps.meta.outputs.tags }}
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/koedame/chordsketch
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          # Only the newest release auto-tags :latest. Re-runs against an
          # older tag (e.g. fixing a broken older release) MUST NOT regress
          # the :latest tag — they only republish the immutable :X.Y.Z and
          # :X.Y aliases. See #1064 for the regression scenario.
          type=raw,value=latest,enable=${{ inputs.promote-latest }}

    - name: Build the image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
      with:
        context: .
        file: Dockerfile.release
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
