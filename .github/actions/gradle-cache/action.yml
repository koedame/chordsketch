name: "Gradle cache"
description: >
  Keep the dependencies a Gradle project resolves from Maven Central and the
  Gradle plugin portal, so a run does not ask those repositories for them
  again. Maven Central answers 429 Too Many Requests to the runners' shared
  addresses now and then. Call it with `phase: restore` before the first
  `gradlew` and with `phase: save` as the last step of the job.
inputs:
  phase:
    description: "`restore` before the build, `save` after it."
    required: true
  directory:
    description: "The Gradle project's directory, relative to the repository root. The key follows its build files."
    required: true
  save-if:
    description: >
      Whether the `save` phase writes the cache. Required so every caller
      states that only `main` writes to the GitHub Actions cache; entries
      written per pull request would exhaust the cache budget.
    required: true
runs:
  using: "composite"
  steps:
    # The wrapper's distribution (145 MB, from services.gradle.org) is not kept:
    # the pool is full and that host does not rate-limit like Maven Central.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.phase == 'restore'
      with:
        path: |
          ~/.gradle/caches/modules-2
        key: gradle-${{ inputs.directory }}-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.gradle.kts', inputs.directory), format('{0}/gradle.properties', inputs.directory), format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs.directory)) }}
        restore-keys: |
          gradle-${{ inputs.directory }}-${{ runner.os }}-

    # The IntelliJ Platform SDK (`idea`, ~780 MB) comes from download.jetbrains.com,
    # not from a repository that rate-limits, and would fill the pool; Gradle
    # fetches it again when the files are missing. A `!` pattern in `path` did not
    # keep it out of the entry (the first entry written was 1012 MB), so it is
    # deleted before the save.
    - name: Leave the IntelliJ Platform SDK out of the cache
      if: inputs.phase == 'save' && inputs.save-if == 'true'
      shell: bash
      run: rm -rf ~/.gradle/caches/modules-2/files-2.1/idea

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.phase == 'save' && inputs.save-if == 'true'
      with:
        path: |
          ~/.gradle/caches/modules-2
        key: gradle-${{ inputs.directory }}-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.gradle.kts', inputs.directory), format('{0}/gradle.properties', inputs.directory), format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs.directory)) }}
