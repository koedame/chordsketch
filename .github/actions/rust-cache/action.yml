name: "Rust cache"
description: >
  Cache the cargo registry and `target/` for a Rust-compiling job with
  `Swatinem/rust-cache`. A wrapper so every caller states `save-if`
  (`.claude/rules/ci-parallelization.md` §2).
inputs:
  shared-key:
    description: >
      `Swatinem/rust-cache` shared-key. Empty falls back to the job id,
      as `Swatinem/rust-cache` does.
    required: false
    default: ""
  save-if:
    description: >
      `Swatinem/rust-cache` save-if. Required so every caller states
      that only `main` writes to the GitHub Actions cache
      (`.claude/rules/ci-parallelization.md` §2).
    required: true
runs:
  using: "composite"
  steps:
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
