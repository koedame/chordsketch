name: "Pack and push the Chocolatey package"
description: >
  `choco pack` the nuspec the caller generated under `choco-pkg/` and push
  the resulting `.nupkg` to the Chocolatey Community Repository, reading
  the status back out of `choco push` so a refusal names its own cause.

  Both publication paths run through this composite: the release fan-out
  (`post-release.yml`'s `update-chocolatey` job) and the by-hand retry
  (`chocolatey-retry.yml`). They previously carried separate copies of the
  push logic, and only the retry copy grew the pre-flight feed probe, the
  409 handling, and the 403 diagnosis — so the path that actually runs on
  every release was the one without them. The two callers now differ only
  in how they dispose of a missing key and of a 403, which
  `on-missing-key` and `on-forbidden` select.

  Expects `choco-pkg/chordsketch.nuspec` and `choco-pkg/tools/` to already
  exist in the workspace; the callers' "Generate package" step writes them.
inputs:
  version:
    description: >
      Package version with no leading `v` (e.g. `0.5.0`). Names the
      `.nupkg` to push and identifies the version on the community feed.
    required: true
  api-key:
    description: >
      Chocolatey push API key (`secrets.CHOCOLATEY_API_KEY`). May be
      empty; `on-missing-key` decides what an empty value means.
    required: false
    default: ""
  on-missing-key:
    description: >
      Disposition when `api-key` is empty. `skip` reports the unconfigured
      channel and exits 0 without packing; `fail` reports it and exits 1.
    required: false
    default: skip
  on-forbidden:
    description: >
      Disposition when `choco push` is refused with HTTP 403 — for this
      package almost always an earlier version still queued for community
      moderation, which blocks every newer push until a moderator clears
      it (#1852). `warn` reports the cause and exits 0; `fail` reports the
      same text as an error and exits 1.
    required: false
    default: warn
runs:
  using: "composite"
  steps:
    - name: Resolve push preconditions
      id: preconditions
      shell: pwsh
      env:
        CHOCOLATEY_API_KEY: ${{ inputs.api-key }}
        ON_MISSING_KEY: ${{ inputs.on-missing-key }}
        ON_FORBIDDEN: ${{ inputs.on-forbidden }}
      run: |
        # Reject an unknown disposition here rather than at the point of
        # use: `on-forbidden` is only read after a push has been
        # attempted, so a typo there would otherwise surface as a wrong
        # exit code on the one run that hits a 403.
        if ($env:ON_MISSING_KEY -notin @('skip', 'fail')) {
          Write-Host "::error::on-missing-key must be 'skip' or 'fail', got '$env:ON_MISSING_KEY'."
          exit 1
        }
        if ($env:ON_FORBIDDEN -notin @('warn', 'fail')) {
          Write-Host "::error::on-forbidden must be 'warn' or 'fail', got '$env:ON_FORBIDDEN'."
          exit 1
        }

        if ($env:CHOCOLATEY_API_KEY) {
          Add-Content -Path $env:GITHUB_OUTPUT -Value "push=true"
          exit 0
        }

        if ($env:ON_MISSING_KEY -eq 'fail') {
          Write-Host "::error::CHOCOLATEY_API_KEY is not set on this repository. Set it (gh secret set CHOCOLATEY_API_KEY -R koedame/chordsketch) and dispatch again."
          exit 1
        }

        Write-Host "CHOCOLATEY_API_KEY secret is not set; skipping Chocolatey push."
        Write-Host "To enable automatic Chocolatey updates, add the API key"
        Write-Host "as a repository secret named CHOCOLATEY_API_KEY."
        Add-Content -Path $env:GITHUB_OUTPUT -Value "push=false"

    - name: Pack
      if: steps.preconditions.outputs.push == 'true'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        Set-Location choco-pkg
        choco pack chordsketch.nuspec
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::choco pack failed with exit code $LASTEXITCODE."
          exit $LASTEXITCODE
        }

        $nupkg = "chordsketch.$env:VERSION.nupkg"
        if (-not (Test-Path -LiteralPath $nupkg)) {
          Write-Host "::error::choco pack reported success but $nupkg is missing."
          exit 1
        }

    - name: Push
      if: steps.preconditions.outputs.push == 'true'
      shell: pwsh
      env:
        CHOCOLATEY_API_KEY: ${{ inputs.api-key }}
        ON_FORBIDDEN: ${{ inputs.on-forbidden }}
        VERSION: ${{ inputs.version }}
      run: |
        $page = "https://community.chocolatey.org/packages/chordsketch/$env:VERSION"

        # A retry gets dispatched repeatedly while a moderation queue
        # drains, so a version that already landed must not read as a
        # failure. The v2 feed answers 200 for a version the repository
        # holds and 404 for one it never accepted (checked against 0.5.0
        # and 0.2.1 vs 0.4.0 and 0.2.2). Anything else means the feed
        # could not be read, which is not itself a reason to refuse to
        # push - fall through and let the push decide.
        $feed = "https://community.chocolatey.org/api/v2/Packages(Id='chordsketch',Version='$env:VERSION')"
        try {
          $probe = Invoke-WebRequest -Uri $feed -SkipHttpErrorCheck
          switch ($probe.StatusCode) {
            200 {
              Write-Host "::notice::chordsketch $env:VERSION is already on the Chocolatey Community Repository; nothing to push. $page"
              exit 0
            }
            404 {
              Write-Host "chordsketch $env:VERSION is not on the repository yet; pushing."
            }
            default {
              Write-Host "::warning::Could not read the Chocolatey feed (HTTP $($probe.StatusCode)); pushing without the pre-flight check."
            }
          }
        } catch {
          # -SkipHttpErrorCheck covers 4xx/5xx answers; a DNS failure or
          # timeout still throws, and the runner's 'Stop' preference is
          # in effect here, so it would abort the step instead.
          Write-Host "::warning::Could not reach the Chocolatey feed ($_); pushing without the pre-flight check."
        }

        # `choco push` collapses every rejection into exit code 1 and
        # carries the HTTP status in its output only, so the output has
        # to be captured to say anything useful about the failure.
        #
        # The two preference lines below are defence in depth, not a
        # workaround for current behaviour: capturing a failing native
        # command's output works as written under the runner's
        # $ErrorActionPreference = 'Stop', because
        # $PSNativeCommandUseErrorActionPreference — the preference that
        # promotes a non-zero native exit into a terminating error —
        # defaults to $false in every shipping PowerShell (7.4 through
        # 7.6; see about_Preference_Variables, "Preference variables and
        # their default values"). Were it ever enabled, for the session
        # or by a future default, `choco push` would throw here before
        # its output could be read and every diagnosis below would
        # become unreachable. Pinning both locally costs two lines and
        # makes this step independent of the ambient setting.
        # Set-Location stays above the preference change so a missing
        # directory still stops the step outright.
        Set-Location choco-pkg

        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false

        $output = & choco push "chordsketch.$env:VERSION.nupkg" `
          --source https://push.chocolatey.org/ `
          --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
        $code = $LASTEXITCODE
        Write-Host $output

        if ($code -eq 0) {
          Write-Host "::notice::Pushed chordsketch $env:VERSION. It stays unlisted until a moderator approves it: $page"
          exit 0
        }

        if ($output -match '409 \(Conflict\)') {
          Write-Host "::notice::The repository already holds chordsketch $env:VERSION (HTTP 409); nothing to do. $page"
          exit 0
        }

        if ($output -match '403 \(Forbidden\)') {
          $diagnosis = "choco push was refused with HTTP 403. The usual cause is an earlier version still queued for community moderation, which blocks every newer push until a moderator clears it (#1852). Open $page and read 'Package Status': 'Submitted' means still queued, and the review-timeline badge reads 'Ready for review' in that state - only an approved package unblocks this push. Once it clears, publish this version with 'gh workflow run chocolatey-retry.yml -R koedame/chordsketch -f tag=v$env:VERSION'. If the earlier version is already approved, check the API key next: https://community.chocolatey.org/account"
          if ($env:ON_FORBIDDEN -eq 'fail') {
            Write-Host "::error::$diagnosis"
            exit 1
          }
          Write-Host "::warning::$diagnosis"
          exit 0
        }

        Write-Host "::error::choco push failed with exit code $code; see the step output above."
        exit $code
