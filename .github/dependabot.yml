version: 2

# Backlog note: Dependabot stops opening pull requests for an ecosystem once
# five of its PRs are open (the default `open-pull-requests-limit`), and no
# scheduled job for that ecosystem appeared while five were open
# (github_actions: from 2026-07-12, cargo: from 2026-07-19). Updates only
# resume when the open PRs are merged or closed — an unattended backlog
# silently stops updates rather than queueing them. Grouping (below) keeps an
# ecosystem at one grouped PR plus its majors, so the limit is reached only by
# five unmerged majors.
updates:
  # Patch and minor updates are grouped into one PR per ecosystem per week;
  # every major update still opens its own PR, one dependency per PR.
  # Cargo classifies a pre-1.0 minor bump (0.55 -> 0.57) as major, so those
  # stay individual too. Security updates are not grouped (`applies-to`
  # defaults to version updates) and still open immediately, one per
  # advisory. Both shapes are reviewed the same way: every dependency a PR
  # updates is audited for advisories and behavioural deltas, any required
  # code changes are applied, and the safe ones are squash-merged.

  # `directory: "/"` reads only `.github/workflows/` and a root `action.yml`,
  # so the composite actions under `.github/actions/` need their own entry in
  # `directories`. Across several directories a group still opens one PR, but
  # an ungrouped major opens one PR per directory that pins the action; the
  # `actions-major` group with `group-by: dependency-name` keeps a major at one
  # PR per dependency covering every directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      # `github/codeql-action/init` and `/analyze` must stay on the same
      # version ("All steps in a workflow that use `github/codeql-action` must
      # use the same version"), so every update of either, major included,
      # goes into one PR. Groups match top to bottom, so this one has to come
      # before the others.
      codeql-action:
        patterns: ["github/codeql-action/*"]
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
        group-by: dependency-name

  # A cargo PR changes `Cargo.lock`, which `THIRD_PARTY_LICENSES.md` is
  # generated from; `.github/workflows/dependabot-licenses.yml` pushes the
  # regenerated file to the PR branch as one commit.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # `packaging/flatpak/requirements.txt` pins the packages the Flatpak source
  # generators run on. It is not a lockfile of the shipped app, but the weekly
  # dependency audit fails on any advisory against it, so its pins have to
  # follow upstream releases like the other ecosystems do.
  - package-ecosystem: "pip"
    directory: "/packaging/flatpak"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # `directory: "/"` reads every file at the repository root whose name
  # contains "dockerfile" (case-insensitive), so this one entry covers both
  # `Dockerfile` and `Dockerfile.release`. Their `FROM` lines are pinned to
  # tag@sha256 digest (see the comments there); Dependabot bumps the tag and
  # the digest together, and refreshes the digest alone when a tag is
  # republished.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
