version: 2

# Backlog note: Dependabot stops opening pull requests for an ecosystem once
# five of its PRs are open (the default `open-pull-requests-limit`), and no
# scheduled job for that ecosystem has appeared since its fifth PR was opened
# (github_actions: 2026-07-12, cargo: 2026-07-19). Updates only resume when the
# open PRs are merged or closed — an unattended backlog silently stops updates
# rather than queueing them.
updates:
  # Dependabot opens one PR per dependency for every update type
  # (patch, minor, AND major). The `/dependabot-review` slash command
  # processes the resulting backlog: it audits each PR for advisories
  # and behavioural deltas, applies any required code changes, and
  # squash-merges the safe ones. See `.claude/commands/dependabot-review.md`
  # and ADR-0016 for the rationale, and #1838 for the prior major-block
  # decision this configuration supersedes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
