# Flatpak manifest for the ChordSketch desktop app.
#
# Not buildable as it stands: the JSON files it names are generated by
# `prepare.py` next to a copy of this file. See README.md.
id: me.koeda.ChordSketch
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.llvm22
command: chordsketch-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The metronome and chord / key audition play through Web Audio.
  - --socket=pulseaudio

modules:
  # Rust stable with the wasm32-unknown-unknown standard library, which the
  # rust-stable SDK extension does not ship. Build-only.
  - rust-toolchain.json

  # The wasm-bindgen CLI at the version Cargo.lock pins. Build-only.
  - wasm-bindgen-cli.json

  - name: chordsketch
    buildsystem: simple
    build-options:
      prepend-path: /app/lib/rust/bin:/app/lib/wasm-bindgen/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/llvm22/bin
      # rustc finds its standard libraries next to the librustc_driver it
      # loads, and a rust-stable extension on the library path would win.
      prepend-ld-library-path: /app/lib/rust/lib
      env:
        CARGO_HOME: /run/build/chordsketch/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/chordsketch/flatpak-node/cache
        npm_config_cache: /run/build/chordsketch/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # The WebView's engine: the web build of @chordsketch/wasm-export,
      # which apps/desktop/vite.config.ts aliases @chordsketch/wasm to.
      - cargo build --release --locked -p chordsketch-wasm --target wasm32-unknown-unknown
      - wasm-bindgen --target web --out-dir packages/npm-export/web --out-name chordsketch_wasm
        target/wasm32-unknown-unknown/release/chordsketch_wasm.wasm

      # The editor's tree-sitter grammar, compiled the way
      # `tree-sitter build --wasm` does, against wasi-libc's headers.
      - make -C wasi-libc CC=clang TARGET_TRIPLE=wasm32-wasip1 SYSROOT=$FLATPAK_BUILDER_BUILDDIR/wasi-sysroot
        OBJDIR=$FLATPAK_BUILDER_BUILDDIR/wasi-obj $FLATPAK_BUILDER_BUILDDIR/wasi-obj/copy-include-headers.stamp
      - cd packages/tree-sitter-chordpro/src && clang --target=wasm32-wasip1 --sysroot=$FLATPAK_BUILDER_BUILDDIR/wasi-sysroot
        -o ../tree-sitter-chordpro.wasm -fPIC -shared -Os -Wl,--export=tree_sitter_chordpro
        -Wl,--allow-undefined -Wl,--no-entry -nostdlib -fno-exceptions -fvisibility=hidden
        -I . parser.c scanner.c

      # The WebView frontend.
      - npm ci --prefix packages/react
      - npm ci --prefix apps/desktop
      - node apps/desktop/scripts/build-grammar-wasm.mjs --grammar-prebuilt
      - cd apps/desktop && node_modules/.bin/vite build

      - cargo build --release --locked -p chordsketch-desktop --features tauri/custom-protocol
      - install -Dm755 target/release/chordsketch-desktop -t $FLATPAK_DEST/bin
      - install -Dm644 packaging/flatpak/$FLATPAK_ID.desktop -t $FLATPAK_DEST/share/applications
      - install -Dm644 packaging/flatpak/$FLATPAK_ID.metainfo.xml -t $FLATPAK_DEST/share/metainfo
      - install -Dm644 assets/logo.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 apps/desktop/LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE
      - install -Dm644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE-MIT
      - install -Dm644 crates/render-ireal/LICENSE-OFL.txt NOTICE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID
    sources:
      - chordsketch-source.json
      - type: git
        url: https://github.com/WebAssembly/wasi-libc.git
        tag: wasi-sdk-29
        commit: ac020b86fd44bafe60aa4fa12f407d16e3731329
        dest: wasi-libc
      - cargo-sources.json
      - node-sources.json
