# ------------------------------------------------ npm (framework packages)
#
# @chordsketch/react-ui, @chordsketch/react, @chordsketch/vue and
# @chordsketch/svelte are published from packages/<name>/ on their own
# release cadence (docs/releasing.md Steps 7e-7h), decoupled from the
# workspace version that the release tag carries. The rollup's only
# assertion is "the registry's newest version equals the tag", which is
# not a claim that holds for these packages, so they carry
# `expected_version = "skip"` rather than a version the tag never
# promised. Their per-PR verification is source-side: react-ui.yml,
# react.yml, vue.yml, svelte.yml and playground-smoke.yml build and test
# each package from the workspace on every PR that touches it.
#
# `skip` here does not mean nothing watches the registry. That these four
# are installable from npm is asserted daily by readme-smoke.yml's
# npm-react-ui / npm-react / npm-vue / npm-svelte jobs, which install the
# `latest` dist-tag and server-render a component from it (ADR-0064).

[[channels]]
id = "npm-react-ui"
display = "npm — @chordsketch/react-ui"
kind = "npm"
package = "@chordsketch/react-ui"
expected_version = "skip"
skip_reason = """
Versions on its own cadence per ADR-0029, not on the workspace release
tag, so the rollup's tag-equality assertion does not apply. First
published at 0.1.0 on 2026-09-12.
"""
required_secrets = []  # Per ADR-0008: maintainer-local manual publish.
notes = "Manual local publish per ADR-0008 (docs/releasing.md Step 7e). Carries no @chordsketch/wasm dependency."

[[channels]]
id = "npm-react"
display = "npm — @chordsketch/react"
kind = "npm"
package = "@chordsketch/react"
expected_version = "skip"
skip_reason = """
Versions on its own cadence, not on the workspace release tag, so the
rollup's tag-equality assertion does not apply. First published at
0.4.0 on 2026-09-12.
"""
required_secrets = []  # Per ADR-0008: maintainer-local manual publish.
notes = "Manual local publish per ADR-0008 (docs/releasing.md Step 7f)."

