# Release channels manifest.
#
# Single source of truth for every distribution channel chordsketch ships to.
# Consumed by:
#   1. `.github/workflows/release-verify.yml` — post-release rollup that
#      queries every channel's registry and fails if a version is stale,
#      missing, or a public-visibility contract is broken.
#   2. `scripts/check-env-secrets.py` — fail-fast secrets check at the top of
#      every publish job. The `required_secrets` field below is the list that
#      must be present in the GitHub Actions environment at publish time.
#
# This file is TOML (not YAML, despite what the issue body suggests) because
# tomllib is in the Python standard library from 3.11 onward; using TOML keeps
# the check scripts dependency-free. All YAML-specific language in issue #1506
# should be read as "the manifest file" regardless of extension.
#
# When adding a new channel:
#   - Add an [[channels]] entry with kind, package, expected_version,
#     required_secrets.
#   - If you add it behind an environment gate, also create that environment
#     in repo settings and add its secrets.
#   - Register the channel in README.md `## Installation` if it is user-facing,
#     and add smoke coverage under `.github/workflows/readme-smoke.yml` per
#     `.claude/rules/readme-sync.md`. A channel that is NOT advertised there
#     gets no smoke job, so give it `expected_version = "exists"` unless the
#     tag-equality check already covers it.
#   - Update `docs/releasing.md` Step 1 bump list if the channel has a manifest.
#
# `expected_version` names the question the rollup asks of the registry, and
# takes exactly three values. `scripts/_release_channels.py` rejects any other.
#
#   "tag"    — the registry's newest version equals the release tag.
#   "exists" — the package is still served publicly, whatever its version
#              (ADR-0065). For a channel that publishes on its own cadence,
#              tag-equality is not a true statement about it but "still
#              installable" is, and that is what a silent unpublish breaks.
#   "skip"   — no assertion at all; `skip_reason` must say why. The entry
#              exists to record the channel.
#
# There is no "pin an explicit version here" mode: the rollup runs once per
# workspace release tag, so a pinned version would go stale — and turn the
# rollup red — the moment an independently-versioned package is bumped
# between tags.
#
# Two situations call for `"skip"`:
#   - The channel has no publish on this tag at all (manual PR flows such as
#     winget, nixpkgs, MacPorts).
#   - The channel publishes on its own cadence AND something else already
#     asserts it is installable — the `@chordsketch/{react-ui,react,vue,svelte}`
#     framework packages, which readme-smoke.yml installs daily (ADR-0064).
#     Off-cadence channels with no such coverage take `"exists"` instead.

