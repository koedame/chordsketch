# ------------------------------------------------ npm (chordpro-lite)
#
# @chordsketch/chordpro-lite is not a framework binding but shares their
# release shape: published from packages/chordpro-lite/ on its own cadence
# (docs/releasing.md Step 7i), decoupled from the workspace version the
# release tag carries, so tag-equality is not a statement about it either.
#
# Unlike the four above it is not advertised under README ## Installation —
# it is a helper for consumers already using the engine, listed in the
# packages table — so readme-smoke.yml has no job for it and nothing was
# asking npm about it at all. This is the channel `exists` was added for
# (ADR-0065): the rollup asserts daily that the registry still serves it
# anonymously and that its tarball is still fetchable. Its per-PR
# verification stays source-side: chordpro-lite.yml typechecks, tests and
# builds it, and the unfiltered directive-catalog-sync job in ci.yml fails
# if its generated directive list drifts from the Rust catalog (ADR-0060).

[[channels]]
id = "npm-chordpro-lite"
display = "npm — @chordsketch/chordpro-lite"
kind = "npm"
package = "@chordsketch/chordpro-lite"
expected_version = "exists"
required_secrets = []  # Per ADR-0008: maintainer-local manual publish.
notes = "Manual local publish per ADR-0008 (docs/releasing.md Step 7i). Carries no @chordsketch/wasm dependency (ADR-0060). First published at 0.1.0 on 2026-09-12."

