kind = "manual"
expected_version = "skip"
skip_reason = """
nixpkgs PR has not been submitted yet. The reference derivation is at
packaging/nix/package.nix. Once the PR is merged and the package is
available in a nixpkgs release channel, change expected_version to "tag".
"""
required_secrets = []
notes = "Manual PR to NixOS/nixpkgs. See packaging/nix/package.nix."

[[channels]]
id = "winget"
display = "winget — microsoft/winget-pkgs"
kind = "manual"
expected_version = "skip"
skip_reason = """
winget publication requires a manual PR against microsoft/winget-pkgs that is
reviewed asynchronously by Microsoft. There is no reliable programmatic
contract to verify at release time, so this channel is intentionally skipped
from the rollup.
"""
required_secrets = []

[[channels]]
id = "macports"
display = "MacPorts — textproc/chordsketch"
kind = "manual"
expected_version = "skip"
skip_reason = """
MacPorts publication requires a manual PR against macports/macports-ports
that is reviewed asynchronously by port maintainers, mirroring the winget
flow above. There is no automated publish step in this repository to
trigger a check against, so this channel is intentionally skipped from the
rollup. See docs/releasing.md step 5 for the per-release Portfile bump +
PR procedure.
"""
required_secrets = []
notes = "Portfile lives at packaging/macports/Portfile. Live install path verified by the macports job in readme-smoke.yml."

