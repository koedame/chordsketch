[[channels]]
id = "chocolatey"
display = "Chocolatey — chordsketch"
kind = "chocolatey"
package = "chordsketch"
expected_version = "tag"
required_secrets = ["CHOCOLATEY_API_KEY"]
notes = """
Published by post-release.yml update-chocolatey job on windows-latest.
_check_chocolatey reports three verdicts, because community moderation
gives this channel a state no other one has: OK once the version is
installable, PENDING while the repository holds it but has not published
it (28-54 days per release, nothing here can clear it), FAIL when the
push never landed (usually a 403 behind a moderation queue, #1852 —
re-run chocolatey-retry.yml). See ADR-0049.
"""

[[channels]]
id = "aur"
display = "AUR — chordsketch"
kind = "aur"
package = "chordsketch"
expected_version = "tag"
required_secrets = ["AUR_SSH_KEY"]
notes = """
Published by post-release.yml update-aur job via SSH push, which aurweb
serves immediately — so the rollup's verdict is the usual binary, not
Chocolatey's three (ADR-0049). _check_aur reads Version from the RPC v5
info endpoint and strips the `[epoch:]`/`-pkgrel` decoration around
pkgver before comparing, because PKGBUILD.template's pkgrel counts
rebuilds of the same release rather than tracking the tag.
"""

[[channels]]
id = "snap"
display = "Snap Store — chordsketch"
kind = "snap"
package = "chordsketch"
expected_version = "tag"
required_secrets = ["SNAP_STORE_TOKEN"]
notes = """
Published by post-release.yml update-snap job (`snapcraft upload
--release=stable`). Strict confinement. _check_snap asserts the default
track's stable channel, across every architecture the store serves it
on, because that is what the README's `sudo snap install chordsketch`
resolves to; candidate / beta / edge are ignored. The endpoint lists
only revisions the store already serves, so there is no "accepted but
unreleased" state to report and the verdict stays binary (ADR-0049).
"""

