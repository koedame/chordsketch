Published by swift.yml update-cocoapods job, after that workflow's
publish job uploads the XCFramework the podspec points at (ADR-0067).
First publish was done manually on 2026-04-15. _check_cocoapods reads
the trunk API's versions array, whose last entry is the most recent
push. `pod trunk push` registers a version synchronously, so — as
everywhere except Chocolatey — the verdict is binary (ADR-0049).
"""

